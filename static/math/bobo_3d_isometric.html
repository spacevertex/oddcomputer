<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Isometric Particle Viewer</title>
<style>
  body{ margin:0; background:#0c1210; color:#d8e4df; font-family:'IBM Plex Mono',monospace; display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{ font-size:15px; font-weight:600; color:#8bf3c9; letter-spacing:0.02em; margin:0 0 4px; }
  .patternRowWrapper{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .patternRowViewport{ width:420px; overflow-x:hidden; scroll-behavior:smooth; }
  .patternRow{ display:flex; gap:8px; flex-wrap:nowrap; }
  .patternBtn{ font-size:11px; padding:6px 12px; flex-shrink:0; }
  .patternBtn.selected{ color:#0c1210; background:#8bf3c9; border-color:#8bf3c9; }
  .patternBtn.selected:hover{ background:#8bf3c9; }
  .arrowBtn{ font-size:12px; padding:8px 10px; flex-shrink:0; }
  .errorBanner{ background:#2a1418; border:1px solid #5a2a30; color:#f2a5a5; font-size:12px; padding:10px 16px; border-radius:6px; margin-bottom:16px; max-width:600px; text-align:center; }

  .isoStage{ display:flex; flex-direction:column; align-items:center; }
  canvas{ background:#0f1815; border:1px solid #223028; border-radius:6px; }
  #iso{ width:640px; height:640px; }

  .lowerPanel{ margin-top:16px; display:flex; flex-direction:column; align-items:center; }
  .table-box{ width:420px; background:#0f1815; border:1px solid #223028; border-radius:6px; box-sizing:border-box; padding:5px 6px; overflow:hidden; }
  #dataTable{ width:100%; table-layout:fixed; border-collapse:collapse; font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:#c3d0ca; }
  #dataTable th{ font-size:8px; font-weight:600; color:#5a6b64; text-align:left; padding:0 2px 3px; overflow:hidden; }
  #dataTable td{ padding:2.5px 2px; white-space:nowrap; overflow:hidden; text-overflow:clip; }
  #dataTable th:nth-child(1), #dataTable td:nth-child(1){ width:8%; }
  #dataTable th:nth-child(2), #dataTable td:nth-child(2){ width:31%; }
  #dataTable th:nth-child(3), #dataTable td:nth-child(3){ width:27%; }
  #dataTable th:nth-child(4), #dataTable td:nth-child(4){ width:22%; }
  #dataTable th:nth-child(5), #dataTable td:nth-child(5){ width:12%; }
  .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; }
  .nbrs{ display:inline-flex; gap:2px; vertical-align:middle; }
  .latticeIcon{ display:inline-grid; grid-template-columns:4px 4px; grid-template-rows:4px 4px; gap:2px; vertical-align:middle; margin-right:5px; }
  .latticeDot{ width:4px; height:4px; border-radius:50%; background:rgba(139,243,201,0.7); }
  #dataTable .legendRow td{ padding-top:7px; border-top:1px solid #223028; color:#7a8a84; }

  .controls{ margin-top:10px; display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; flex-shrink:0; }
  .controls button{ height:30px; box-sizing:border-box; display:inline-flex; align-items:center; justify-content:center; }
  #playBtn.playing{ color:#0c1210; background:#8bf3c9; border-color:#8bf3c9; }
  button{ background:#14201b; border:1px solid #2a3a33; color:#8bf3c9; font-family:inherit; font-size:12px; padding:8px 16px; border-radius:5px; cursor:pointer; }
  button.off{ color:#5a6b64; border-color:#22302a; }
  button:hover{ background:#1a2a23; }
</style>
</head>
<body>
<h1>Isometric Particle Viewer</h1>

<div class="patternRowWrapper">
  <button class="arrowBtn" id="arrowLeft">&#9664;</button>
  <div class="patternRowViewport" id="patternRowViewport">
    <div class="patternRow" id="patternRow"></div>
  </div>
  <button class="arrowBtn" id="arrowRight">&#9654;</button>
</div>
<div class="errorBanner" id="errorBanner" style="display:none;"></div>

<div class="isoStage">
  <canvas id="iso" width="640" height="640"></canvas>
</div>
<div class="lowerPanel">
  <div class="table-box"><table id="dataTable"></table></div>
  <div class="controls">
    <button id="playBtn">Play</button>
    <button id="stepBtn">Step</button>
    <button id="trailsBtn">Trails</button>
    <button class="off" id="vectorsBtn">Vectors</button>
  </div>
</div>

<script>
function sign(v){ return v>0?1:(v<0?-1:0); }
function step3D(particles){
  const deltas = particles.map((p,i)=>{
    let bestD=Infinity, tied=[];
    for (let j=0;j<particles.length;j++){
      if (j===i) continue;
      const q=particles[j];
      const d2=(q.x-p.x)**2+(q.y-p.y)**2+(q.z-p.z)**2;
      if (d2<bestD){ bestD=d2; tied=[j]; } else if (d2===bestD) tied.push(j);
    }
    let sx=0,sy=0,sz=0;
    tied.forEach(j=>{ const q=particles[j]; sx+=sign(q.x-p.x); sy+=sign(q.y-p.y); sz+=sign(q.z-p.z); });
    return { dvx:sign(sx), dvy:sign(sy), dvz:sign(sz) };
  });
  particles.forEach((p,i)=>{
    p.vx+=deltas[i].dvx; p.vy+=deltas[i].dvy; p.vz+=deltas[i].dvz;
    p.x+=p.vx; p.y+=p.vy; p.z+=p.vz;
  });
}

// same flat manifest system as the orthographic viewer — a plain array of
// filenames, each file in this same folder, button label = filename minus
// ".json". No folders here, so (unlike the 2D picker) there's nothing that
// needs localStorage.
const PATTERNS_DIR = '3d_patterns/';
const MASTER_COLORS = ['#8bf3c9', '#f2a65a', '#7aa7f2', '#e17dbf', '#e0c05a', '#ef6f6f', '#b28cf2', '#a8e05a', '#5ad6e0'];
function colorFor(i){
  if (i < MASTER_COLORS.length) return MASTER_COLORS[i];
  return 'hsl(' + Math.round(((i - MASTER_COLORS.length) * 137.508 + 100) % 360) + ',72%,68%)';
}

let manifestFiles = [];
let currentFilename = null;
let INITIAL, PERIOD, COLORS, history, displayHistory, tieInfo, SCALE;
let LATTICE_FRAC = {x:0, y:0, z:0};
let DEPTH_MIN = 0, DEPTH_MAX = 1;
let FLOOR = { halfX:1, halfY:1, levels:[] };
let ISO_CENTER = { x:0, y:0 };   // the projected bounding box's own center, in raw (pre-scale) iso units

const DIVERGE_THRESHOLD = 10000;
const FALLBACK_CAP = 2000;

function dryRun(initial, statedPeriod){
  const maxTicks = (Number.isInteger(statedPeriod) && statedPeriod > 0) ? statedPeriod * 2 : FALLBACK_CAP;
  let particles = initial.map(p => ({...p}));
  const startStr = JSON.stringify(particles);
  const ranges = { x:{min:Infinity,max:-Infinity}, y:{min:Infinity,max:-Infinity}, z:{min:Infinity,max:-Infinity} };
  function track(pts){ pts.forEach(p=>['x','y','z'].forEach(ax=>{ if(p[ax]<ranges[ax].min) ranges[ax].min=p[ax]; if(p[ax]>ranges[ax].max) ranges[ax].max=p[ax]; })); }
  track(particles);

  let diverged = false, periodConfirmed = false;
  for (let t=1; t<=maxTicks; t++){
    step3D(particles);
    for (const p of particles){
      if (Math.abs(p.x)>DIVERGE_THRESHOLD || Math.abs(p.y)>DIVERGE_THRESHOLD || Math.abs(p.z)>DIVERGE_THRESHOLD){ diverged = true; break; }
    }
    if (diverged) break;
    track(particles);
    if (t === statedPeriod && JSON.stringify(particles) === startStr) periodConfirmed = true;
  }
  return { ranges, diverged, periodConfirmed };
}

function showError(message){
  const banner = document.getElementById('errorBanner');
  banner.textContent = message;
  banner.style.display = 'block';
}
function hideError(){
  document.getElementById('errorBanner').style.display = 'none';
}

// ---- isometric projection ---------------------------------------------
// XY is the floor, Z is "up" on screen — the reverse of a screen's own
// axes, which is why this needs its own projection rather than reusing
// worldToCanvas from the orthographic viewer. This is the plain
// orthographic projection of a camera sitting out along the (1,1,1)
// direction looking back at the origin: X and Y both feed into screen-X
// through a 30-degree-rotated basis, and Z purely lifts the point upward
// on screen (subtracted, since canvas Y grows downward).
//
// One convenient property of this exact split (cos(30), sin(30)) is that
// a one-unit step along X, Y, or Z moves the projected point by the same
// screen distance in every case, since cos^2(30)+sin^2(30) = 1. That
// means a single lattice-step formula can size the horizontal grid dots
// and the vertical spacing between floors at once — see getLatticeStep().
const COS30 = Math.cos(Math.PI/6), SIN30 = Math.sin(Math.PI/6);
function isoProject(x, y, z){
  return { ix: (x - y) * COS30, iy: (x + y) * SIN30 - z };
}
// with only one camera (unlike the three orthographic panels, each hiding
// a different axis) there is one honest depth value: how far the point
// sits along the (1,1,1) viewing direction. Larger = closer to the
// camera. This also drives occlusion and the size/alpha cue below.
function depthOf(x, y, z){ return x + y + z; }

const CANVAS_SIZE = 640;
const CANVAS_CENTER = CANVAS_SIZE / 2;
function worldToScreen(x, y, z){
  const {ix, iy} = isoProject(x, y, z);
  return { cx: CANVAS_CENTER + (ix - ISO_CENTER.x) * SCALE, cy: CANVAS_CENTER + (iy - ISO_CENTER.y) * SCALE };
}

function getLatticeStep(){
  return Math.max(1, Math.round(10 / SCALE));
}

function computeRange(axis){
  let min=Infinity, max=-Infinity;
  displayHistory.forEach(frame => frame.forEach(p => { if (p[axis]<min) min=p[axis]; if (p[axis]>max) max=p[axis]; }));
  return { min, max };
}

function loadPattern(initial, period, filename){
  const check = dryRun(initial, period);

  if (check.diverged){
    showError('"' + filename + '" was rejected: coordinates exceeded ' + DIVERGE_THRESHOLD + ' within ' + (period*2) + ' ticks — this pattern appears to diverge rather than repeat.');
    return;
  }
  if (!check.periodConfirmed){
    showError('"' + filename + '" was rejected: it does not return to its starting state at the claimed period (' + period + '). The file may be corrupted or hand-edited incorrectly.');
    return;
  }
  hideError();

  currentFilename = filename;
  INITIAL = initial;
  PERIOD = period;
  COLORS = INITIAL.map((_, i) => colorFor(i));

  history = [];
  tieInfo = [];
  let particles = INITIAL.map(pt=>({...pt}));
  for (let t=0; t<=PERIOD; t++){
    history.push(particles.map(pt=>({x:pt.x,y:pt.y,z:pt.z,vx:pt.vx,vy:pt.vy,vz:pt.vz})));
    tieInfo.push(particles.map((pt,i)=>{
      let bestD=Infinity, tied=[];
      for (let j=0;j<particles.length;j++){
        if (j===i) continue;
        const q=particles[j];
        const d2=(q.x-pt.x)**2+(q.y-pt.y)**2+(q.z-pt.z)**2;
        if (d2<bestD){ bestD=d2; tied=[j]; } else if (d2===bestD) tied.push(j);
      }
      let sx=0,sy=0,sz=0;
      tied.forEach(j=>{ const q=particles[j]; sx+=sign(q.x-pt.x); sy+=sign(q.y-pt.y); sz+=sign(q.z-pt.z); });
      return { tied, dvx:sign(sx), dvy:sign(sy), dvz:sign(sz) };
    }));
    if (t<PERIOD) step3D(particles);
  }

  // same pure display-shift as the orthographic viewer: centre the
  // pattern's own bounding box at the origin. history itself (what the
  // table reads) stays untouched, raw, exact integers.
  let gMinX=Infinity, gMinY=Infinity, gMinZ=Infinity, gMaxX=-Infinity, gMaxY=-Infinity, gMaxZ=-Infinity;
  history.forEach(frame => frame.forEach(pt=>{
    if (pt.x<gMinX) gMinX=pt.x; if (pt.x>gMaxX) gMaxX=pt.x;
    if (pt.y<gMinY) gMinY=pt.y; if (pt.y>gMaxY) gMaxY=pt.y;
    if (pt.z<gMinZ) gMinZ=pt.z; if (pt.z>gMaxZ) gMaxZ=pt.z;
  }));
  const gCenterX=(gMinX+gMaxX)/2, gCenterY=(gMinY+gMaxY)/2, gCenterZ=(gMinZ+gMaxZ)/2;
  LATTICE_FRAC = {
    x: (((-gCenterX) % 1) + 1) % 1,
    y: (((-gCenterY) % 1) + 1) % 1,
    z: (((-gCenterZ) % 1) + 1) % 1,
  };
  displayHistory = history.map(frame => frame.map(pt => ({
    x:pt.x-gCenterX, y:pt.y-gCenterY, z:pt.z-gCenterZ, vx:pt.vx, vy:pt.vy, vz:pt.vz
  })));

  // depth range for the size/alpha cue, over the true (1,1,1) depth value
  DEPTH_MIN = Infinity; DEPTH_MAX = -Infinity;
  displayHistory.forEach(frame => frame.forEach(p => {
    const d = depthOf(p.x, p.y, p.z);
    if (d<DEPTH_MIN) DEPTH_MIN = d; if (d>DEPTH_MAX) DEPTH_MAX = d;
  }));

  // ---- dynamic scale: fit the whole trajectory's PROJECTED shape, not
  // its world-space extent — an isometric projection skews and mixes the
  // three axes together, so the on-screen shape isn't simply proportional
  // to any one axis's world extent the way an orthographic panel's is.
  // Project every point at unit scale first, find the resulting on-screen
  // bounding box, then solve for the scale (and the offset that centres
  // it) the same way the orthographic viewer solves for a single radius.
  let isoMinX=Infinity, isoMaxX=-Infinity, isoMinY=Infinity, isoMaxY=-Infinity;
  displayHistory.forEach(frame => frame.forEach(p => {
    const {ix, iy} = isoProject(p.x, p.y, p.z);
    if (ix<isoMinX) isoMinX=ix; if (ix>isoMaxX) isoMaxX=ix;
    if (iy<isoMinY) isoMinY=iy; if (iy>isoMaxY) isoMaxY=iy;
  }));
  const isoW = Math.max(isoMaxX-isoMinX, 0.0001), isoH = Math.max(isoMaxY-isoMinY, 0.0001);
  const USABLE_HALF = CANVAS_CENTER - 20;       // small margin from the canvas edge
  const MAX_DOT_RADIUS_WORLD = 0.45;             // half of the largest dot diameter (0.9), same budget as the orthographic viewer
  SCALE = Math.min(
    USABLE_HALF / (isoW/2 + MAX_DOT_RADIUS_WORLD),
    USABLE_HALF / (isoH/2 + MAX_DOT_RADIUS_WORLD)
  );
  ISO_CENTER = { x:(isoMinX+isoMaxX)/2, y:(isoMinY+isoMaxY)/2 };

  // ---- floor sheets: one pale parallelogram per Z-height the pattern
  // actually visits, spaced by the same lattice step as the grid dots (a
  // one-unit step costs the same screen distance on every axis in this
  // projection — see the note above isoProject), so the vertical rhythm
  // between floors matches the horizontal rhythm of the dots on each one.
  // Each floor is sized to the pattern's own X/Y extent plus one step of
  // padding, the same "fit what's actually there" approach as the
  // orthographic grid, rather than a fixed generic size.
  const step = getLatticeStep();
  const zr = computeRange('z');
  // A floor's screen footprint is set by how far (x-y) and (x+y) actually
  // range — the two combinations isoX and isoY are built from — not by X
  // and Y's own separate extents. A pattern where particles move mostly
  // diagonally (x approx y) can have a large X extent and a large Y
  // extent that mostly cancel in (x-y), so sizing off X and Y alone would
  // make the floor far bigger than what's actually needed to frame it.
  // For an axis-aligned square of half-extent h, both (x-y) and (x+y)
  // range over a full span of 4h, so solve h from whichever of the two
  // actual spans is larger.
  let uMin=Infinity, uMax=-Infinity, vMin=Infinity, vMax=-Infinity;
  displayHistory.forEach(frame => frame.forEach(p => {
    const u=p.x-p.y, v=p.x+p.y;
    if (u<uMin) uMin=u; if (u>uMax) uMax=u; if (v<vMin) vMin=v; if (v>vMax) vMax=v;
  }));
  const half = Math.max(uMax-uMin, vMax-vMin) / 4 + step;
  const halfX = half, halfY = half;
  const kMin = Math.floor((zr.min - step - LATTICE_FRAC.z) / step);
  const kMax = Math.ceil((zr.max + step - LATTICE_FRAC.z) / step);
  const levels = [];
  for (let k=kMin; k<=kMax; k++) levels.push(k*step + LATTICE_FRAC.z);
  FLOOR = { halfX, halfY, levels, step };

  document.querySelectorAll('.patternBtn').forEach(b=>{
    b.classList.toggle('selected', b.dataset.filename === filename);
  });

  currentTick = 0;
  playing = false;
  document.getElementById('playBtn').classList.remove('playing');
  draw();
}

function drawFloor(ctx, zLevel){
  const step = FLOOR.step;
  // the parallelogram itself: a world-space rectangle at this height,
  // projected — a square in world space becomes a rhombus on screen here
  const corners = [
    worldToScreen(-FLOOR.halfX, -FLOOR.halfY, zLevel),
    worldToScreen( FLOOR.halfX, -FLOOR.halfY, zLevel),
    worldToScreen( FLOOR.halfX,  FLOOR.halfY, zLevel),
    worldToScreen(-FLOOR.halfX,  FLOOR.halfY, zLevel),
  ];
  ctx.fillStyle = 'rgba(139,243,201,0.05)';
  ctx.strokeStyle = 'rgba(139,243,201,0.12)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  corners.forEach((c,i)=>{ if (i===0) ctx.moveTo(c.cx,c.cy); else ctx.lineTo(c.cx,c.cy); });
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // grid dots on this floor, phase-aligned in X and Y the same way the
  // orthographic grid aligns to a pattern with a half-integer centre
  ctx.fillStyle = 'rgba(139,243,201,0.22)';
  const startX = -Math.ceil(FLOOR.halfX/step)*step, startY = -Math.ceil(FLOOR.halfY/step)*step;
  for (let gx=startX; gx<=FLOOR.halfX; gx+=step){
    for (let gy=startY; gy<=FLOOR.halfY; gy+=step){
      const wx = gx+LATTICE_FRAC.x, wy = gy+LATTICE_FRAC.y;
      if (Math.abs(wx)>FLOOR.halfX+0.01 || Math.abs(wy)>FLOOR.halfY+0.01) continue;
      const {cx,cy} = worldToScreen(wx, wy, zLevel);
      ctx.fillRect(cx-1, cy-1, 2, 2);
    }
  }
}

let currentTick = 0;
let playing = false;
let lastFrame = 0;
let showTrails = true;
let showVectors = false;

function draw(){
  const ctx = document.getElementById('iso').getContext('2d');
  ctx.fillStyle = '#0f1815';
  ctx.fillRect(0,0,CANVAS_SIZE,CANVAS_SIZE);

  // floors, farthest (lowest Z, since Z feeds positively into depth) to
  // nearest, so a taller floor correctly overlaps a lower one where they
  // share screen space rather than the other way around
  FLOOR.levels.slice().sort((a,b)=>a-b).forEach(z => drawFloor(ctx, z));

  if (showTrails){
    for (let pi=0; pi<INITIAL.length; pi++){
      ctx.strokeStyle = COLORS[pi];
      ctx.globalAlpha = 0.35;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (let t=0; t<PERIOD; t++){
        const pt = displayHistory[t][pi];
        const {cx, cy} = worldToScreen(pt.x, pt.y, pt.z);
        if (t===0) ctx.moveTo(cx,cy); else ctx.lineTo(cx,cy);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  if (showVectors){
    for (let pi=0; pi<INITIAL.length; pi++){
      const pt = displayHistory[currentTick][pi];
      const start = worldToScreen(pt.x, pt.y, pt.z);
      const end = worldToScreen(pt.x+pt.vx, pt.y+pt.vy, pt.z+pt.vz);
      ctx.strokeStyle = COLORS[pi];
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = 0.9;
      ctx.beginPath();
      ctx.moveTo(start.cx, start.cy);
      ctx.lineTo(end.cx, end.cy);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // particle dots: size and alpha both encode true depth along the
  // camera's own viewing direction (x+y+z) — a single honest value here,
  // where the orthographic panels each needed their own proxy axis
  const dotInfos = [];
  for (let pi=0; pi<INITIAL.length; pi++){
    const pt = displayHistory[currentTick][pi];
    const {cx, cy} = worldToScreen(pt.x, pt.y, pt.z);
    const d = depthOf(pt.x, pt.y, pt.z);
    let t = DEPTH_MAX > DEPTH_MIN ? (d - DEPTH_MIN) / (DEPTH_MAX - DEPTH_MIN) : 0.5;
    const diameterWorld = 0.5 + t * (0.9 - 0.5);
    const radiusPx = (diameterWorld / 2) * SCALE;
    const alpha = 0.4 + t * (1.0 - 0.4);
    dotInfos.push({ pi, cx, cy, radiusPx, alpha, t, x:pt.x, y:pt.y, z:pt.z });
  }

  // same occlusion rule as the orthographic viewer: a strictly-closer
  // particle whose circle overlaps a farther one hides it outright,
  // unless the two are at the exact same 3D point, in which case they
  // blend instead. With only one camera here there's no equivalent of
  // "same on THIS panel but different depth" to guard against — true 3D
  // coincidence is the only case that matters.
  const hidden = new Array(dotInfos.length).fill(false);
  for (let i=0; i<dotInfos.length; i++){
    for (let j=0; j<dotInfos.length; j++){
      if (i===j) continue;
      const A = dotInfos[i], B = dotInfos[j];
      if (B.t <= A.t) continue;
      if (A.x===B.x && A.y===B.y && A.z===B.z) continue;
      const dx = A.cx-B.cx, dy = A.cy-B.cy;
      const distSq = dx*dx + dy*dy;
      const radiusSum = A.radiusPx + B.radiusPx;
      if (distSq < radiusSum*radiusSum){ hidden[i] = true; break; }
    }
  }

  dotInfos.forEach((d, idx)=>{
    if (hidden[idx]) return;
    ctx.globalAlpha = d.alpha;
    ctx.fillStyle = COLORS[d.pi];
    ctx.beginPath();
    ctx.arc(d.cx, d.cy, d.radiusPx, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  updateTable();
}

function fmt3(x,y,z){ return '('+x+','+y+','+z+')'; }

function updateTable(){
  const frame = history[currentTick];
  const ties = tieInfo[currentTick];
  const table = document.getElementById('dataTable');
  let html = '<tr><th></th><th>pos</th><th>vel</th><th>accel</th><th>near</th></tr>';
  for (let pi=0; pi<INITIAL.length; pi++){
    const p = frame[pi];
    const t = ties[pi];
    const dot = '<span class="dot" style="background:'+COLORS[pi]+'"></span>';
    const pos = fmt3(p.x, p.y, p.z);
    const vel = fmt3(p.vx, p.vy, p.vz);
    const accel = fmt3(t.dvx, t.dvy, t.dvz);
    const nbrs = '<span class="nbrs">' + t.tied.map(j=>'<span class="dot" style="background:'+COLORS[j]+'"></span>').join('') + '</span>';
    html += '<tr><td>'+dot+'</td><td>'+pos+'</td><td>'+vel+'</td><td>'+accel+'</td><td>'+nbrs+'</td></tr>';
  }
  const latticeIcon = '<span class="latticeIcon"><span class="latticeDot"></span><span class="latticeDot"></span><span class="latticeDot"></span><span class="latticeDot"></span></span>';
  html += '<tr class="legendRow"><td colspan="5">' + latticeIcon + ' = ' + getLatticeStep() + '</td></tr>';
  html += '<tr class="legendRow"><td colspan="5">tick ' + (currentTick+1) + ' / ' + PERIOD + '</td></tr>';
  table.innerHTML = html;
}

function tick(ts){
  if (!playing) return;
  if (ts - lastFrame > 150){
    currentTick = (currentTick + 1) % PERIOD;
    draw();
    lastFrame = ts;
  }
  requestAnimationFrame(tick);
}

document.getElementById('playBtn').addEventListener('click', ()=>{
  playing = !playing;
  document.getElementById('playBtn').classList.toggle('playing', playing);
  if (playing){ lastFrame = 0; requestAnimationFrame(tick); }
});

document.getElementById('stepBtn').addEventListener('click', ()=>{
  playing = false;
  document.getElementById('playBtn').classList.remove('playing');
  currentTick = (currentTick + 1) % PERIOD;
  draw();
});

document.getElementById('trailsBtn').addEventListener('click', ()=>{
  showTrails = !showTrails;
  document.getElementById('trailsBtn').classList.toggle('off', !showTrails);
  draw();
});

document.getElementById('vectorsBtn').addEventListener('click', ()=>{
  showVectors = !showVectors;
  document.getElementById('vectorsBtn').classList.toggle('off', !showVectors);
  draw();
});

function fetchAndLoad(filename){
  fetch(PATTERNS_DIR + filename)
    .then(res => {
      if (!res.ok) throw new Error('could not fetch ' + filename + ' (' + res.status + ')');
      return res.json();
    })
    .then(data => {
      if (!data.nearest || !Number.isInteger(data.period)){
        showError('"' + filename + '" is missing required fields (nearest, period).');
        return;
      }
      loadPattern(data.nearest, data.period, filename);
    })
    .catch(err => showError('Could not load ' + filename + ': ' + err.message));
}

const SCROLL_STEP_PX = 220;
document.getElementById('arrowLeft').addEventListener('click', ()=>{
  document.getElementById('patternRowViewport').scrollLeft -= SCROLL_STEP_PX;
});
document.getElementById('arrowRight').addEventListener('click', ()=>{
  document.getElementById('patternRowViewport').scrollLeft += SCROLL_STEP_PX;
});

fetch(PATTERNS_DIR + 'manifest.json')
  .then(res => {
    if (!res.ok) throw new Error('manifest not found (' + res.status + ')');
    return res.json();
  })
  .then(files => {
    if (!Array.isArray(files) || files.length === 0){
      showError('3d_patterns/manifest.json is empty.');
      return;
    }
    manifestFiles = files;
    const row = document.getElementById('patternRow');
    files.forEach(filename=>{
      const btn = document.createElement('button');
      btn.className = 'patternBtn';
      btn.dataset.filename = filename;
      btn.textContent = filename.replace(/\.json$/i, '');
      btn.addEventListener('click', ()=> fetchAndLoad(filename));
      row.appendChild(btn);
    });
    fetchAndLoad(files[0]);
  })
  .catch(err => {
    showError('No 3d_patterns/manifest.json found (or it failed to load). Expected a JSON array of filenames, e.g. ["n3p50.json", "n5p18.json"], with each file in that same 3d_patterns/ folder.');
  });
</script>
