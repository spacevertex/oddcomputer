<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Orthographic Particle Viewer</title>
<style>
  body{ margin:0; background:#0c1210; color:#d8e4df; font-family:'IBM Plex Mono',monospace; display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{ font-size:15px; font-weight:600; color:#8bf3c9; letter-spacing:0.02em; margin:0 0 4px; }
  .sub{ font-size:12px; color:#7a8a84; margin-bottom:20px; text-align:center; max-width:460px; }
  .panels{ display:grid; grid-template-columns:320px 320px; grid-template-rows:auto auto; gap:16px; }
  .panel{ display:flex; flex-direction:column; align-items:center; }
  canvas{ background:#0f1815; border:1px solid #223028; border-radius:6px; }
  .label{ font-size:12px; color:#7a8a84; margin-top:8px; }
  .table-box{ width:320px; height:320px; background:#0f1815; border:1px solid #223028; border-radius:6px; box-sizing:border-box; padding:5px 6px; overflow:hidden; }
  #dataTable{ width:100%; table-layout:fixed; border-collapse:collapse; font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:#c3d0ca; }
  #dataTable th{ font-size:8px; font-weight:600; color:#5a6b64; text-align:left; padding:0 2px 3px; overflow:hidden; }
  #dataTable td{ padding:2.5px 2px; white-space:nowrap; overflow:hidden; text-overflow:clip; }
  #dataTable th:nth-child(1), #dataTable td:nth-child(1){ width:8%; }
  #dataTable th:nth-child(2), #dataTable td:nth-child(2){ width:31%; }
  #dataTable th:nth-child(3), #dataTable td:nth-child(3){ width:27%; }
  #dataTable th:nth-child(4), #dataTable td:nth-child(4){ width:22%; }
  #dataTable th:nth-child(5), #dataTable td:nth-child(5){ width:12%; }
  .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; }
  .nbrs{ display:inline-flex; gap:2px; vertical-align:middle; }
  .latticeIcon{ display:inline-grid; grid-template-columns:4px 4px; grid-template-rows:4px 4px; gap:2px; vertical-align:middle; margin-right:5px; }
  .latticeDot{ width:4px; height:4px; border-radius:50%; background:rgba(139,243,201,0.7); }
  #dataTable .legendRow td{ padding-top:7px; border-top:1px solid #223028; color:#7a8a84; }
  .controls{ margin-top:20px; display:flex; align-items:center; gap:14px; }
  button{ background:#14201b; border:1px solid #2a3a33; color:#8bf3c9; font-family:inherit; font-size:12px; padding:8px 16px; border-radius:5px; cursor:pointer; }
  button.off{ color:#5a6b64; border-color:#22302a; }
  button:hover{ background:#1a2a23; }
  .tick{ font-size:12px; color:#7a8a84; min-width:90px; text-align:center; }
  .patternRowWrapper{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .patternRowViewport{ width:420px; overflow-x:hidden; }
  .patternRow{ display:flex; gap:8px; flex-wrap:nowrap; scroll-behavior:smooth; }
  .patternBtn{ font-size:11px; padding:6px 12px; flex-shrink:0; }
  .patternBtn.selected{ color:#0c1210; background:#8bf3c9; border-color:#8bf3c9; }
  .patternBtn.selected:hover{ background:#8bf3c9; }
  .arrowBtn{ font-size:12px; padding:8px 10px; flex-shrink:0; }
  .errorBanner{ background:#2a1418; border:1px solid #5a2a30; color:#f2a5a5; font-size:12px; padding:10px 16px; border-radius:6px; margin-bottom:16px; max-width:600px; text-align:center; }
</style>
</head>
<body>
<h1 id="mainTitle">Orthographic Particle Viewer</h1>
<div class="sub" id="subLine">3 nearest particles &middot; period 210</div>
<div class="patternRowWrapper">
  <button class="arrowBtn" id="arrowLeft">&#9664;</button>
  <div class="patternRowViewport" id="patternRowViewport">
    <div class="patternRow" id="patternRow"></div>
  </div>
  <button class="arrowBtn" id="arrowRight">&#9654;</button>
</div>
<div class="errorBanner" id="errorBanner" style="display:none;"></div>
<div class="panels">
  <div class="panel"><canvas id="xz" width="320" height="320"></canvas><div class="label">XZ</div></div>
  <div class="panel"><canvas id="yz" width="320" height="320"></canvas><div class="label">YZ</div></div>
  <div class="panel"><canvas id="xy" width="320" height="320"></canvas><div class="label">XY</div></div>
  <div class="panel"><div class="table-box"><table id="dataTable"></table></div></div>
</div>
<div class="controls">
  <button id="playBtn">Play</button>
  <button id="stepBtn">Step</button>
  <button id="trailsBtn">Trails</button>
  <button class="off" id="vectorsBtn">Vectors</button>
  <span class="tick" id="tickLabel">tick 0 / 18</span>
</div>
<script>
function sign(v){ return v>0?1:(v<0?-1:0); }
function step3D(particles){
  const deltas = particles.map((p,i)=>{
    let bestD=Infinity, tied=[];
    for (let j=0;j<particles.length;j++){
      if (j===i) continue;
      const q=particles[j];
      const d2=(q.x-p.x)**2+(q.y-p.y)**2+(q.z-p.z)**2;
      if (d2<bestD){ bestD=d2; tied=[j]; } else if (d2===bestD) tied.push(j);
    }
    let sx=0,sy=0,sz=0;
    tied.forEach(j=>{ const q=particles[j]; sx+=sign(q.x-p.x); sy+=sign(q.y-p.y); sz+=sign(q.z-p.z); });
    return { dvx:sign(sx), dvy:sign(sy), dvz:sign(sz) };
  });
  particles.forEach((p,i)=>{
    p.vx+=deltas[i].dvx; p.vy+=deltas[i].dvy; p.vz+=deltas[i].dvz;
    p.x+=p.vx; p.y+=p.vy; p.z+=p.vz;
  });
}

// patterns now live as flat JSON files in 3d_patterns/, indexed by a flat
// manifest.json (just an array of filenames — no folders, no per-entry
// metadata, since the button label IS the filename minus ".json").
const PATTERNS_DIR = '3d_patterns/';
const MASTER_COLORS = ['#8bf3c9', '#f2a65a', '#7aa7f2', '#e17dbf', '#e0c05a'];

let manifestFiles = [];
let currentFilename = null;
let INITIAL, PERIOD, COLORS, history, displayHistory, tieInfo, DEPTH_RANGES, SCALE;
let LATTICE_FRAC = {x:0, y:0, z:0};

// Safety cap for a pattern that turns out to be broken (hand-edited,
// wrong claimed period, or genuinely unbounded). Never trust the JSON's
// own metadata blindly: run forward up to 2x the claimed period, bail
// immediately if any coordinate blows past a threshold no real oscillator
// would ever need, and separately confirm the state at exactly the
// claimed period matches the start — a pattern that doesn't actually
// close the loop it claims to is invalid regardless of whether it also
// happens to diverge within this window.
const DIVERGE_THRESHOLD = 10000;
const FALLBACK_CAP = 2000;

function dryRun(initial, statedPeriod){
  const maxTicks = (Number.isInteger(statedPeriod) && statedPeriod > 0) ? statedPeriod * 2 : FALLBACK_CAP;
  let particles = initial.map(p => ({...p}));
  const startStr = JSON.stringify(particles);
  const ranges = { x:{min:Infinity,max:-Infinity}, y:{min:Infinity,max:-Infinity}, z:{min:Infinity,max:-Infinity} };
  function track(pts){ pts.forEach(p=>['x','y','z'].forEach(ax=>{ if(p[ax]<ranges[ax].min) ranges[ax].min=p[ax]; if(p[ax]>ranges[ax].max) ranges[ax].max=p[ax]; })); }
  track(particles);

  let diverged = false, periodConfirmed = false;
  for (let t=1; t<=maxTicks; t++){
    step3D(particles);
    for (const p of particles){
      if (Math.abs(p.x)>DIVERGE_THRESHOLD || Math.abs(p.y)>DIVERGE_THRESHOLD || Math.abs(p.z)>DIVERGE_THRESHOLD){ diverged = true; break; }
    }
    if (diverged) break;
    track(particles);
    if (t === statedPeriod && JSON.stringify(particles) === startStr) periodConfirmed = true;
  }
  return { ranges, diverged, periodConfirmed };
}

function showError(message){
  const banner = document.getElementById('errorBanner');
  banner.textContent = message;
  banner.style.display = 'block';
}
function hideError(){
  document.getElementById('errorBanner').style.display = 'none';
}

function loadPattern(initial, period, filename){
  const check = dryRun(initial, period);

  if (check.diverged){
    showError('"' + filename + '" was rejected: coordinates exceeded ' + DIVERGE_THRESHOLD + ' within ' + (period*2) + ' ticks — this pattern appears to diverge rather than repeat.');
    return;
  }
  if (!check.periodConfirmed){
    showError('"' + filename + '" was rejected: it does not return to its starting state at the claimed period (' + period + '). The file may be corrupted or hand-edited incorrectly.');
    return;
  }
  hideError();

  currentFilename = filename;
  INITIAL = initial;
  PERIOD = period;
  COLORS = MASTER_COLORS.slice(0, INITIAL.length);

  // dynamic scale: the pattern only occupies the positive region from the
  // corner-shifted origin (which sits at each panel's center), so the
  // real budget is half the canvas per axis, not the full width. Solve
  // for the scale that fits the largest extent across all three axes
  // (same scale for every panel, so the shape stays proportional) plus
  // room for the largest possible particle dot at that scale.
  const extentX = check.ranges.x.max - check.ranges.x.min;
  const extentY = check.ranges.y.max - check.ranges.y.min;
  const extentZ = check.ranges.z.max - check.ranges.z.min;
  const maxExtent = Math.max(extentX, extentY, extentZ, 0.0001);
  const USABLE_RADIUS_PX = 145; // full canvas radius from center, minus a small margin
  const MAX_DOT_RADIUS_WORLD = 0.45; // half of the largest dot diameter (0.9)
  // centering (not corner-anchoring) means the pattern uses the full
  // radius in every direction from screen-center, not just one quadrant —
  // so the budget is against half the extent (the farthest point from the
  // pattern's own middle), not the full extent.
  SCALE = USABLE_RADIUS_PX / (maxExtent / 2 + MAX_DOT_RADIUS_WORLD);

  history = [];
  tieInfo = [];
  let particles = INITIAL.map(pt=>({...pt}));
  for (let t=0; t<=PERIOD; t++){
    history.push(particles.map(pt=>({x:pt.x,y:pt.y,z:pt.z,vx:pt.vx,vy:pt.vy,vz:pt.vz})));
    tieInfo.push(particles.map((pt,i)=>{
      let bestD=Infinity, tied=[];
      for (let j=0;j<particles.length;j++){
        if (j===i) continue;
        const q=particles[j];
        const d2=(q.x-pt.x)**2+(q.y-pt.y)**2+(q.z-pt.z)**2;
        if (d2<bestD){ bestD=d2; tied=[j]; } else if (d2===bestD) tied.push(j);
      }
      let sx=0,sy=0,sz=0;
      tied.forEach(j=>{ const q=particles[j]; sx+=sign(q.x-pt.x); sy+=sign(q.y-pt.y); sz+=sign(q.z-pt.z); });
      return { tied, dvx:sign(sx), dvy:sign(sy), dvz:sign(sz) };
    }));
    if (t<PERIOD) step3D(particles);
  }

  // pure display shift: pattern's own bounding-box CENTER to the origin
  // (not its corner) — this lets it use the full radius in every
  // direction from each panel's center instead of only one quadrant.
  // Velocity is translation-invariant, so only position fields shift.
  let gMinX=Infinity, gMinY=Infinity, gMinZ=Infinity, gMaxX=-Infinity, gMaxY=-Infinity, gMaxZ=-Infinity;
  history.forEach(frame => frame.forEach(pt=>{
    if (pt.x<gMinX) gMinX=pt.x; if (pt.x>gMaxX) gMaxX=pt.x;
    if (pt.y<gMinY) gMinY=pt.y; if (pt.y>gMaxY) gMaxY=pt.y;
    if (pt.z<gMinZ) gMinZ=pt.z; if (pt.z>gMaxZ) gMaxZ=pt.z;
  }));
  const gCenterX=(gMinX+gMaxX)/2, gCenterY=(gMinY+gMaxY)/2, gCenterZ=(gMinZ+gMaxZ)/2;
  // NOTE: this is a display-only transform for screen placement. history
  // itself stays untouched (raw, exact integers, matching the source
  // file) — the table reads from history directly. Only displayHistory,
  // used by the three rendering panels, gets shifted, and only for
  // centering the pattern on screen. A pattern whose extent spans an odd
  // number of units will have a half-integer center by simple arithmetic
  // (e.g. a span of 85 centers at 42.5) — that's expected here, and never
  // leaks into anything the table shows.
  //
  // Every raw (integer) position shares this SAME fractional remainder
  // once shifted, since they're all integers minus the same constant. The
  // lattice grid, though, is drawn at pure integers — so for any pattern
  // whose center lands on a half-integer, particles would visually land
  // exactly halfway between lattice dots instead of on one. Fixed by
  // phase-shifting the lattice by this same fractional offset per axis.
  LATTICE_FRAC = {
    x: (((-gCenterX) % 1) + 1) % 1,
    y: (((-gCenterY) % 1) + 1) % 1,
    z: (((-gCenterZ) % 1) + 1) % 1,
  };
  displayHistory = history.map(frame => frame.map(pt => ({
    x:pt.x-gCenterX, y:pt.y-gCenterY, z:pt.z-gCenterZ, vx:pt.vx, vy:pt.vy, vz:pt.vz
  })));

  DEPTH_RANGES = { x: computeRange('x'), y: computeRange('y'), z: computeRange('z') };

  document.getElementById('subLine').textContent =
    INITIAL.length + ' nearest particles \u00b7 period ' + PERIOD;
  document.querySelectorAll('.patternBtn').forEach(b=>{
    b.classList.toggle('selected', b.dataset.filename === filename);
  });

  currentTick = 0;
  playing = false;
  document.getElementById('playBtn').textContent = 'Play';
  draw();
}

const CENTER = 160;
function worldToCanvas(a, b, flipA){ const aa = flipA ? -a : a; return { cx: CENTER + aa*SCALE, cy: CENTER - b*SCALE }; }

// shared by drawGrid and the table's legend row, so the two can never
// silently disagree about what spacing is actually on screen.
function getLatticeStep(){
  return Math.max(1, Math.round(10 / SCALE));
}

function drawGrid(ctx, flipA, fracA, fracB){
  // lattice points instead of crossing lines — much less visually busy,
  // especially at high scale where a full line-grid gets dense fast.
  // Spacing is throttled so screen-space gaps stay reasonable regardless
  // of how zoomed-in a given pattern's scale happens to be, rather than
  // drawing one dot per integer unconditionally (which could mean tens
  // of thousands of points for a large, small-scale pattern).
  const step = getLatticeStep();
  const range = Math.ceil(CENTER / SCALE) + step;
  ctx.fillStyle = 'rgba(139,243,201,0.3)';
  for (let ga=-range; ga<=range; ga+=step){
    for (let gb=-range; gb<=range; gb+=step){
      // fracA/fracB phase-shift the lattice to match wherever this
      // pattern's own integer positions actually land after centering —
      // without this, patterns with a half-integer center would show
      // particles floating exactly between dots instead of on one.
      const {cx, cy} = worldToCanvas(ga+fracA, gb+fracB, flipA);
      if (cx < -2 || cx > 322 || cy < -2 || cy > 322) continue;
      ctx.fillRect(cx-0.8, cy-0.8, 1.6, 1.6);
    }
  }
}

// depth = the axis NOT shown in that panel (the one pointing "into the
// glass"). flipA on yz only, per the corrected cube orientation: top of
// XY should align with left of YZ.
const canvases = {
  xz: { ctx: document.getElementById('xz').getContext('2d'), a:'x', b:'z', depth:'y', flipA:false, flipDepth:false },
  yz: { ctx: document.getElementById('yz').getContext('2d'), a:'y', b:'z', depth:'x', flipA:true, flipDepth:false },
  xy: { ctx: document.getElementById('xy').getContext('2d'), a:'x', b:'y', depth:'z', flipA:false, flipDepth:true },
};

// per-axis min/max across the whole trajectory, so the full 0.5-0.9 size
// range and 0.4-1.0 alpha range both actually get used, regardless of
// how large this particular oscillator's extent happens to be.
function computeRange(axis){
  let min=Infinity, max=-Infinity;
  displayHistory.forEach(frame => frame.forEach(p => { if (p[axis]<min) min=p[axis]; if (p[axis]>max) max=p[axis]; }));
  return { min, max };
}

let currentTick = 0;
let playing = false;
let lastFrame = 0;
let showTrails = true;
let showVectors = false;

function draw(){
  Object.values(canvases).forEach(({ctx, a, b, depth, flipA, flipDepth})=>{
    ctx.fillStyle = '#0f1815';
    ctx.fillRect(0,0,320,320);
    drawGrid(ctx, flipA, LATTICE_FRAC[a], LATTICE_FRAC[b]);

    if (showTrails){
      // draw the COMPLETE closed loop every frame — for a genuinely
      // periodic pattern the full orbit is a fixed shape, not something
      // that should grow from tick 0 and then visibly snap back to a
      // single point each time the animation wraps around.
      for (let pi=0; pi<INITIAL.length; pi++){
        ctx.strokeStyle = COLORS[pi];
        ctx.globalAlpha = 0.35;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        for (let t=0; t<PERIOD; t++){
          const pt = displayHistory[t][pi];
          const {cx, cy} = worldToCanvas(pt[a], pt[b], flipA);
          if (t===0) ctx.moveTo(cx,cy); else ctx.lineTo(cx,cy);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    if (showVectors){
      // velocity as a plain line segment from current position to
      // position+velocity, using this panel's own a/b axis pair — same
      // flip applied to both endpoints so the vector's direction stays
      // consistent with everything else drawn in this panel.
      for (let pi=0; pi<INITIAL.length; pi++){
        const pt = displayHistory[currentTick][pi];
        const start = worldToCanvas(pt[a], pt[b], flipA);
        const end = worldToCanvas(pt[a] + pt['v'+a], pt[b] + pt['v'+b], flipA);
        ctx.strokeStyle = COLORS[pi];
        ctx.lineWidth = 1.5;
        ctx.globalAlpha = 0.9;
        ctx.beginPath();
        ctx.moveTo(start.cx, start.cy);
        ctx.lineTo(end.cx, end.cy);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    // particle dots: size and alpha both encode the third (depth) axis —
    // higher value = closer to the glass = bigger and more opaque.
    // Calibrated per-axis so this specific oscillator's actual range maps
    // onto the full requested [0.5, 0.9] world-unit diameter and
    // [0.4, 1.0] alpha bands, not just whatever fraction it happens to hit.
    const { min: dMin, max: dMax } = DEPTH_RANGES[depth];
    for (let pi=0; pi<INITIAL.length; pi++){
      const pt = displayHistory[currentTick][pi];
      const {cx, cy} = worldToCanvas(pt[a], pt[b], flipA);
      const depthVal = pt[depth];
      let t = dMax > dMin ? (depthVal - dMin) / (dMax - dMin) : 0.5;
      if (flipDepth) t = 1 - t;
      const diameterWorld = 0.5 + t * (0.9 - 0.5);
      const radiusPx = (diameterWorld / 2) * SCALE;
      const alpha = 0.4 + t * (1.0 - 0.4);

      ctx.globalAlpha = alpha;
      ctx.fillStyle = COLORS[pi];
      ctx.beginPath();
      ctx.arc(cx, cy, radiusPx, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  });
  document.getElementById('tickLabel').textContent = 'tick ' + currentTick + ' / ' + PERIOD;
  updateTable();
}

// compact tuple formatting, no spaces — space here is genuinely tight,
// and the numbers are always single-digit-ish integers, so "(-1,0,2)"
// reads cleanly enough without them.
function fmt3(x,y,z){ return '('+x+','+y+','+z+')'; }

function updateTable(){
  const frame = history[currentTick];
  const ties = tieInfo[currentTick];
  const table = document.getElementById('dataTable');
  let html = '<tr><th></th><th>pos</th><th>vel</th><th>accel</th><th>near</th></tr>';
  for (let pi=0; pi<INITIAL.length; pi++){
    const p = frame[pi];
    const t = ties[pi];
    const dot = '<span class="dot" style="background:'+COLORS[pi]+'"></span>';
    const pos = fmt3(p.x, p.y, p.z);
    const vel = fmt3(p.vx, p.vy, p.vz);
    const accel = fmt3(t.dvx, t.dvy, t.dvz);
    const nbrs = '<span class="nbrs">' + t.tied.map(j=>'<span class="dot" style="background:'+COLORS[j]+'"></span>').join('') + '</span>';
    html += '<tr><td>'+dot+'</td><td>'+pos+'</td><td>'+vel+'</td><td>'+accel+'</td><td>'+nbrs+'</td></tr>';
  }
  const latticeIcon = '<span class="latticeIcon"><span class="latticeDot"></span><span class="latticeDot"></span><span class="latticeDot"></span><span class="latticeDot"></span></span>';
  html += '<tr class="legendRow"><td colspan="5">' + latticeIcon + ' = ' + getLatticeStep() + '</td></tr>';
  table.innerHTML = html;
}

function tick(ts){
  if (!playing) return;
  if (ts - lastFrame > 150){
    currentTick = (currentTick + 1) % PERIOD;
    draw();
    lastFrame = ts;
  }
  requestAnimationFrame(tick);
}

document.getElementById('playBtn').addEventListener('click', ()=>{
  playing = !playing;
  document.getElementById('playBtn').textContent = playing ? 'Pause' : 'Play';
  if (playing){ lastFrame = 0; requestAnimationFrame(tick); }
});

document.getElementById('stepBtn').addEventListener('click', ()=>{
  playing = false;
  document.getElementById('playBtn').textContent = 'Play';
  currentTick = (currentTick + 1) % PERIOD;
  draw();
});

document.getElementById('trailsBtn').addEventListener('click', ()=>{
  showTrails = !showTrails;
  document.getElementById('trailsBtn').classList.toggle('off', !showTrails);
  draw();
});

document.getElementById('vectorsBtn').addEventListener('click', ()=>{
  showVectors = !showVectors;
  document.getElementById('vectorsBtn').classList.toggle('off', !showVectors);
  draw();
});

function fetchAndLoad(filename){
  fetch(PATTERNS_DIR + filename)
    .then(res => {
      if (!res.ok) throw new Error('could not fetch ' + filename + ' (' + res.status + ')');
      return res.json();
    })
    .then(data => {
      if (!data.nearest || !Number.isInteger(data.period)){
        showError('"' + filename + '" is missing required fields (nearest, period).');
        return;
      }
      loadPattern(data.nearest, data.period, filename);
    })
    .catch(err => showError('Could not load ' + filename + ': ' + err.message));
}

const SCROLL_STEP_PX = 220;
document.getElementById('arrowLeft').addEventListener('click', ()=>{
  document.getElementById('patternRowViewport').scrollLeft -= SCROLL_STEP_PX;
});
document.getElementById('arrowRight').addEventListener('click', ()=>{
  document.getElementById('patternRowViewport').scrollLeft += SCROLL_STEP_PX;
});

fetch(PATTERNS_DIR + 'manifest.json')
  .then(res => {
    if (!res.ok) throw new Error('manifest not found (' + res.status + ')');
    return res.json();
  })
  .then(files => {
    if (!Array.isArray(files) || files.length === 0){
      showError('3d_patterns/manifest.json is empty.');
      return;
    }
    manifestFiles = files;
    const row = document.getElementById('patternRow');
    files.forEach(filename=>{
      const btn = document.createElement('button');
      btn.className = 'patternBtn';
      btn.dataset.filename = filename;
      btn.textContent = filename.replace(/\.json$/i, '');
      btn.addEventListener('click', ()=> fetchAndLoad(filename));
      row.appendChild(btn);
    });
    fetchAndLoad(files[0]);
  })
  .catch(err => {
    showError('No 3d_patterns/manifest.json found (or it failed to load). Expected a JSON array of filenames, e.g. ["n3p50.json", "n5p18.json"], with each file in that same 3d_patterns/ folder.');
  });
</script>
</body>
</html>
