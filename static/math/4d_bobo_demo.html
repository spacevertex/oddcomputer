<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>4D Orthographic Particle Viewer (test)</title>
<style>
  body{ margin:0; background:#0c1210; color:#d8e4df; font-family:'IBM Plex Mono',monospace; display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{ font-size:15px; font-weight:600; color:#8bf3c9; letter-spacing:0.02em; margin:0 0 14px; }
  .viewRow{ display:flex; gap:8px; margin-bottom:18px; }
  .panels{ display:grid; grid-template-columns:320px 320px; grid-template-rows:auto auto; gap:16px; }
  .panel{ display:flex; flex-direction:column; align-items:center; height:343px; box-sizing:border-box; }
  canvas{ background:#0f1815; border:1px solid #223028; border-radius:6px; }
  .label{ font-size:12px; line-height:15px; height:15px; color:#7a8a84; margin-top:8px; }
  .table-box{ width:320px; flex:1 1 auto; min-height:0; background:#0f1815; border:1px solid #223028; border-radius:6px; box-sizing:border-box; padding:5px 6px; overflow:hidden; }
  #dataTable{ width:100%; table-layout:fixed; border-collapse:collapse; font-family:'IBM Plex Mono',monospace; font-size:9px; color:#c3d0ca; }
  #dataTable th{ font-size:8px; font-weight:600; color:#5a6b64; text-align:left; padding:0 2px 3px; overflow:hidden; }
  #dataTable td{ padding:2.5px 2px; white-space:nowrap; overflow:hidden; text-overflow:clip; }
  #dataTable th:nth-child(1), #dataTable td:nth-child(1){ width:7%; }
  #dataTable th:nth-child(2), #dataTable td:nth-child(2){ width:29%; }
  #dataTable th:nth-child(3), #dataTable td:nth-child(3){ width:25%; }
  #dataTable th:nth-child(4), #dataTable td:nth-child(4){ width:25%; }
  #dataTable th:nth-child(5), #dataTable td:nth-child(5){ width:14%; }
  /* the one component of each tuple that belongs to the axis hidden in the current view */
  .hid{ color:#5a6b64; }
  .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; }
  .nbrs{ display:inline-flex; gap:2px; vertical-align:middle; }
  .latticeIcon{ display:inline-grid; grid-template-columns:4px 4px; grid-template-rows:4px 4px; gap:2px; vertical-align:middle; margin-right:5px; }
  .latticeDot{ width:4px; height:4px; border-radius:50%; background:rgba(139,243,201,0.7); }
  #dataTable .legendRow td{ padding-top:7px; border-top:1px solid #223028; color:#7a8a84; }
  .controls{ margin-top:10px; display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; flex-shrink:0; }
  .controls button{ height:30px; box-sizing:border-box; display:inline-flex; align-items:center; justify-content:center; }
  #playBtn.playing{ color:#0c1210; background:#8bf3c9; border-color:#8bf3c9; }
  button{ background:#14201b; border:1px solid #2a3a33; color:#8bf3c9; font-family:inherit; font-size:12px; padding:8px 16px; border-radius:5px; cursor:pointer; }
  button.off{ color:#5a6b64; border-color:#22302a; }
  button:hover{ background:#1a2a23; }
  .viewBtn{ font-size:11px; padding:6px 12px; }
  .viewBtn.selected{ color:#0c1210; background:#8bf3c9; border-color:#8bf3c9; }
  .viewBtn.selected:hover{ background:#8bf3c9; }
</style>
</head>
<body>
<h1>4D Orthographic Particle Viewer</h1>

<div class="viewRow" id="viewRow"></div>

<div class="panels">
  <div class="panel"><canvas id="cvTL" width="320" height="320"></canvas><div class="label" id="lblTL">XZ</div></div>
  <div class="panel"><canvas id="cvTR" width="320" height="320"></canvas><div class="label" id="lblTR">YZ</div></div>
  <div class="panel"><canvas id="cvBL" width="320" height="320"></canvas><div class="label" id="lblBL">XY</div></div>
  <div class="panel">
    <div class="table-box"><table id="dataTable"></table></div>
    <div class="controls">
      <button id="playBtn">Play</button>
      <button id="stepBtn">Step</button>
      <button id="trailsBtn">Trails</button>
      <button class="off" id="vectorsBtn">Vectors</button>
    </div>
  </div>
</div>

<script>
function sign(v){ return v>0?1:(v<0?-1:0); }
const AXES = ['x','y','z','w'];

// ---- the pattern: one orbiter around a fauxbobo (two co-located nearest, both at rest) ----
// The pair is always tied with itself at distance 0 and both halves vote identically for the
// orbiter, so the orbiter feels one unanimous pull toward the pair. In effect each axis runs its
// own independent 1D orbit: periods 6, 8, 10, 12 on x, y, z, w (spans 2, 4, 6, 9), LCM = 120.
const PERIOD = 120;
const INITIAL = [
  {x:-1, y:-1, z:-2, w:-1,  vx:-1, vy:1, vz:1, vw:2},
  {x:0, y:0, z:0, w:0,      vx:0, vy:0, vz:0, vw:0},
  {x:0, y:0, z:0, w:0,      vx:0, vy:0, vz:0, vw:0},
];
const COLORS = ['#8bf3c9', '#f2a65a', '#7aa7f2'];

// ---- the general 4D rule: squared distance over four axes, per-axis summed tie vote ----
function neighborInfo(particles, i){
  const p = particles[i];
  let bestD = Infinity, tied = [];
  for (let j=0; j<particles.length; j++){
    if (j===i) continue;
    const q = particles[j];
    let d2 = 0;
    for (const a of AXES) d2 += (q[a]-p[a])**2;
    if (d2 < bestD){ bestD = d2; tied = [j]; } else if (d2 === bestD) tied.push(j);
  }
  const d = {};
  for (const a of AXES){
    let s = 0;
    tied.forEach(j => { s += sign(particles[j][a]-p[a]); });
    d[a] = sign(s);
  }
  return { tied, d };
}
function step4D(particles){
  const info = particles.map((_,i) => neighborInfo(particles, i));   // simultaneous update
  particles.forEach((p,i) => {
    for (const a of AXES){ p['v'+a] += info[i].d[a]; p[a] += p['v'+a]; }
  });
}

// ---- precompute one full period ----
let history = [];       // raw, exact integers: what the table shows
let tieInfo = [];       // per tick: {tied, d:{x,y,z,w}} per particle
{
  const ps = INITIAL.map(p => ({...p}));
  for (let t=0; t<=PERIOD; t++){
    history.push(ps.map(p => ({x:p.x,y:p.y,z:p.z,w:p.w,vx:p.vx,vy:p.vy,vz:p.vz,vw:p.vw})));
    tieInfo.push(ps.map((_,i) => neighborInfo(ps, i)));
    if (t < PERIOD) step4D(ps);
  }
}

// display-only copy, centred per axis on the pattern's bounding-box middle. A span with an odd
// length centres on a half-integer; that lives only in displayHistory, never in the table, and the
// lattice is phase-shifted by the same fraction so particles still land on lattice dots.
const CENTERS = {}, LATTICE_FRAC = {};
let maxExtent = 0.0001;
for (const a of AXES){
  let mn = Infinity, mx = -Infinity;
  history.forEach(fr => fr.forEach(p => { if (p[a]<mn) mn=p[a]; if (p[a]>mx) mx=p[a]; }));
  CENTERS[a] = (mn+mx)/2;
  LATTICE_FRAC[a] = (((-CENTERS[a]) % 1) + 1) % 1;
  maxExtent = Math.max(maxExtent, mx-mn);
}
const displayHistory = history.map(fr => fr.map(p => {
  const q = {};
  for (const a of AXES){ q[a] = p[a]-CENTERS[a]; q['v'+a] = p['v'+a]; }
  return q;
}));
const DEPTH_RANGES = {};
for (const a of AXES){
  let mn = Infinity, mx = -Infinity;
  displayHistory.forEach(fr => fr.forEach(p => { if (p[a]<mn) mn=p[a]; if (p[a]>mx) mx=p[a]; }));
  DEPTH_RANGES[a] = { min:mn, max:mx };
}

// one scale for ALL four axes, so nothing rescales when you cycle views
const CENTER = 160;
const USABLE_RADIUS_PX = 145;
const MAX_DOT_RADIUS_WORLD = 0.45;
const SCALE = USABLE_RADIUS_PX / (maxExtent/2 + MAX_DOT_RADIUS_WORLD);
function worldToCanvas(a, b, flipA){ const aa = flipA ? -a : a; return { cx: CENTER + aa*SCALE, cy: CENTER - b*SCALE }; }
function getLatticeStep(){ return Math.max(1, Math.round(10 / SCALE)); }

function drawGrid(ctx, flipA, fracA, fracB){
  const step = getLatticeStep();
  const range = Math.ceil(CENTER / SCALE) + step;
  ctx.fillStyle = 'rgba(139,243,201,0.3)';
  for (let ga=-range; ga<=range; ga+=step){
    for (let gb=-range; gb<=range; gb+=step){
      const {cx, cy} = worldToCanvas(ga+fracA, gb+fracB, flipA);
      if (cx < -2 || cx > 322 || cy < -2 || cy > 322) continue;
      ctx.fillRect(cx-0.8, cy-0.8, 1.6, 1.6);
    }
  }
}

// ---- views: each one is a 3D projection (one axis hidden) shown as the usual three panels ----
const VIEWS = [
  { name:'XYZ', axes:['x','y','z'], hidden:'w' },
  { name:'XYW', axes:['x','y','w'], hidden:'z' },
  { name:'XZW', axes:['x','z','w'], hidden:'y' },
  { name:'YZW', axes:['y','z','w'], hidden:'x' },
];
let viewIndex = 0;
const ctxs = {
  TL: document.getElementById('cvTL').getContext('2d'),
  TR: document.getElementById('cvTR').getContext('2d'),
  BL: document.getElementById('cvBL').getContext('2d'),
};
// same arrangement as the 3D viewer, with the view's three axes standing in for X, Y, Z:
// top-left (p,r) depth q; top-right (q,r) mirrored, depth p; bottom-left (p,q), depth r flipped
function currentPanels(){
  const [p,q,r] = VIEWS[viewIndex].axes;
  return [
    { key:'TL', a:p, b:r, depth:q, flipA:false, flipDepth:false },
    { key:'TR', a:q, b:r, depth:p, flipA:true,  flipDepth:false },
    { key:'BL', a:p, b:q, depth:r, flipA:false, flipDepth:true  },
  ];
}

let currentTick = 0, playing = false, lastFrame = 0;
let showTrails = true, showVectors = false;

function draw(){
  const view = VIEWS[viewIndex];
  currentPanels().forEach(({key, a, b, depth, flipA, flipDepth})=>{
    const ctx = ctxs[key];
    ctx.fillStyle = '#0f1815';
    ctx.fillRect(0,0,320,320);
    drawGrid(ctx, flipA, LATTICE_FRAC[a], LATTICE_FRAC[b]);

    if (showTrails){
      for (let pi=0; pi<INITIAL.length; pi++){
        ctx.strokeStyle = COLORS[pi];
        ctx.globalAlpha = 0.35;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        for (let t=0; t<PERIOD; t++){
          const pt = displayHistory[t][pi];
          const {cx, cy} = worldToCanvas(pt[a], pt[b], flipA);
          if (t===0) ctx.moveTo(cx,cy); else ctx.lineTo(cx,cy);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    if (showVectors){
      for (let pi=0; pi<INITIAL.length; pi++){
        const pt = displayHistory[currentTick][pi];
        const start = worldToCanvas(pt[a], pt[b], flipA);
        const end = worldToCanvas(pt[a] + pt['v'+a], pt[b] + pt['v'+b], flipA);
        ctx.strokeStyle = COLORS[pi];
        ctx.lineWidth = 1.5;
        ctx.globalAlpha = 0.9;
        ctx.beginPath();
        ctx.moveTo(start.cx, start.cy);
        ctx.lineTo(end.cx, end.cy);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    // dots: size and alpha encode the ONE remaining depth axis of this panel; the fourth axis,
    // hidden in this whole view, has no cue at all (it only shows up when you cycle)
    const { min: dMin, max: dMax } = DEPTH_RANGES[depth];
    const dotInfos = [];
    for (let pi=0; pi<INITIAL.length; pi++){
      const pt = displayHistory[currentTick][pi];
      const {cx, cy} = worldToCanvas(pt[a], pt[b], flipA);
      let t = dMax > dMin ? (pt[depth] - dMin) / (dMax - dMin) : 0.5;
      if (flipDepth) t = 1 - t;
      const radiusPx = ((0.5 + t*(0.9-0.5)) / 2) * SCALE;
      const alpha = 0.4 + t*(1.0-0.4);
      dotInfos.push({ pi, cx, cy, radiusPx, alpha, t, vis:view.axes.map(ax => pt[ax]) });
    }

    // occlusion: a strictly closer particle whose circle overlaps a farther one hides it outright.
    // "Same point" (blend instead) means identical in everything this view can see.
    const hidden = new Array(dotInfos.length).fill(false);
    for (let i=0; i<dotInfos.length; i++){
      for (let j=0; j<dotInfos.length; j++){
        if (i===j) continue;
        const A = dotInfos[i], B = dotInfos[j];
        if (B.t <= A.t) continue;
        if (A.vis[0]===B.vis[0] && A.vis[1]===B.vis[1] && A.vis[2]===B.vis[2]) continue;
        const dx = A.cx-B.cx, dy = A.cy-B.cy;
        const distSq = dx*dx + dy*dy;
        const radiusSum = A.radiusPx + B.radiusPx;
        if (distSq < radiusSum*radiusSum){ hidden[i] = true; break; }
      }
    }
    dotInfos.forEach((d, idx)=>{
      if (hidden[idx]) return;
      ctx.globalAlpha = d.alpha;
      ctx.fillStyle = COLORS[d.pi];
      ctx.beginPath();
      ctx.arc(d.cx, d.cy, d.radiusPx, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    });
  });
  updateTable();
}

// ---- table: raw integers, four-component tuples; the hidden axis's component is dimmed ----
function fmt4(get){
  const hid = VIEWS[viewIndex].hidden;
  return '(' + AXES.map(a => a===hid ? '<span class="hid">'+get(a)+'</span>' : String(get(a))).join(',') + ')';
}
function updateTable(){
  const frame = history[currentTick];
  const ties = tieInfo[currentTick];
  let html = '<tr><th></th><th>pos</th><th>vel</th><th>accel</th><th>near</th></tr>';
  for (let pi=0; pi<INITIAL.length; pi++){
    const p = frame[pi], t = ties[pi];
    const dot = '<span class="dot" style="background:'+COLORS[pi]+'"></span>';
    const nbrs = '<span class="nbrs">' + t.tied.map(j=>'<span class="dot" style="background:'+COLORS[j]+'"></span>').join('') + '</span>';
    html += '<tr><td>'+dot+'</td><td>'+fmt4(a=>p[a])+'</td><td>'+fmt4(a=>p['v'+a])+'</td><td>'+fmt4(a=>t.d[a])+'</td><td>'+nbrs+'</td></tr>';
  }
  const latticeIcon = '<span class="latticeIcon"><span class="latticeDot"></span><span class="latticeDot"></span><span class="latticeDot"></span><span class="latticeDot"></span></span>';
  html += '<tr class="legendRow"><td colspan="5">' + latticeIcon + ' = ' + getLatticeStep() + '</td></tr>';
  html += '<tr class="legendRow"><td colspan="5">tick ' + (currentTick+1) + ' / ' + PERIOD + '</td></tr>';
  document.getElementById('dataTable').innerHTML = html;
}

function tick(ts){
  if (!playing) return;
  if (ts - lastFrame > 150){
    currentTick = (currentTick + 1) % PERIOD;
    draw();
    lastFrame = ts;
  }
  requestAnimationFrame(tick);
}

// ---- view cycling: buttons, or x = next view, z = previous view ----
function setView(i){
  viewIndex = ((i % VIEWS.length) + VIEWS.length) % VIEWS.length;
  document.querySelectorAll('.viewBtn').forEach((b, idx) => b.classList.toggle('selected', idx === viewIndex));
  currentPanels().forEach(({key, a, b}) => {
    document.getElementById('lbl'+key).textContent = (a+b).toUpperCase();
  });
  draw();
}
VIEWS.forEach((v, idx) => {
  const btn = document.createElement('button');
  btn.className = 'viewBtn';
  btn.textContent = v.name;
  btn.title = 'hides ' + v.hidden.toUpperCase();
  btn.addEventListener('click', () => setView(idx));
  document.getElementById('viewRow').appendChild(btn);
});
window.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'x') setView(viewIndex + 1);
  else if (k === 'z') setView(viewIndex - 1);
});

document.getElementById('playBtn').addEventListener('click', ()=>{
  playing = !playing;
  document.getElementById('playBtn').classList.toggle('playing', playing);
  if (playing){ lastFrame = 0; requestAnimationFrame(tick); }
});
document.getElementById('stepBtn').addEventListener('click', ()=>{
  playing = false;
  document.getElementById('playBtn').classList.remove('playing');
  currentTick = (currentTick + 1) % PERIOD;
  draw();
});
document.getElementById('trailsBtn').addEventListener('click', ()=>{
  showTrails = !showTrails;
  document.getElementById('trailsBtn').classList.toggle('off', !showTrails);
  draw();
});
document.getElementById('vectorsBtn').addEventListener('click', ()=>{
  showVectors = !showVectors;
  document.getElementById('vectorsBtn').classList.toggle('off', !showVectors);
  draw();
});

setView(0);
</script>
</body>
</html>
