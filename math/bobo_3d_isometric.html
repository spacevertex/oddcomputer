<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Isometric Particle Viewer</title>
<style>
  body{ margin:0; background:#0c1210; color:#d8e4df; font-family:'IBM Plex Mono',monospace; display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{ font-size:15px; font-weight:600; color:#8bf3c9; letter-spacing:0.02em; margin:0 0 4px; }
  .patternRowWrapper{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .patternRowViewport{ width:420px; overflow-x:hidden; scroll-behavior:smooth; }
  .patternRow{ display:flex; gap:8px; flex-wrap:nowrap; }
  .patternBtn{ font-size:11px; padding:6px 12px; flex-shrink:0; }
  .patternBtn.selected{ color:#0c1210; background:#8bf3c9; border-color:#8bf3c9; }
  .patternBtn.selected:hover{ background:#8bf3c9; }
  .arrowBtn{ font-size:12px; padding:8px 10px; flex-shrink:0; }
  .errorBanner{ background:#2a1418; border:1px solid #5a2a30; color:#f2a5a5; font-size:12px; padding:10px 16px; border-radius:6px; margin-bottom:16px; max-width:600px; text-align:center; }

  .isoStage{ display:flex; flex-direction:column; align-items:center; }
  canvas{ background:#0f1815; border:1px solid #223028; border-radius:6px; }
  #iso{ width:640px; height:640px; }

  .lowerPanel{ margin-top:16px; display:flex; flex-direction:column; align-items:center; }
  .table-box{ width:420px; background:#0f1815; border:1px solid #223028; border-radius:6px; box-sizing:border-box; padding:5px 6px; overflow:hidden; }
  #dataTable{ width:100%; table-layout:fixed; border-collapse:collapse; font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:#c3d0ca; }
  #dataTable th{ font-size:8px; font-weight:600; color:#5a6b64; text-align:left; padding:0 2px 3px; overflow:hidden; }
  #dataTable td{ padding:2.5px 2px; white-space:nowrap; overflow:hidden; text-overflow:clip; }
  #dataTable th:nth-child(1), #dataTable td:nth-child(1){ width:8%; }
  #dataTable th:nth-child(2), #dataTable td:nth-child(2){ width:31%; }
  #dataTable th:nth-child(3), #dataTable td:nth-child(3){ width:27%; }
  #dataTable th:nth-child(4), #dataTable td:nth-child(4){ width:22%; }
  #dataTable th:nth-child(5), #dataTable td:nth-child(5){ width:12%; }
  .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; }
  .nbrs{ display:inline-flex; gap:2px; vertical-align:middle; }
  #dataTable .legendRow td{ padding-top:7px; border-top:1px solid #223028; color:#7a8a84; }

  .controls{ margin-top:10px; display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; flex-shrink:0; }
  .controls button{ height:30px; box-sizing:border-box; display:inline-flex; align-items:center; justify-content:center; }
  #playBtn.playing{ color:#0c1210; background:#8bf3c9; border-color:#8bf3c9; }
  button{ background:#14201b; border:1px solid #2a3a33; color:#8bf3c9; font-family:inherit; font-size:12px; padding:8px 16px; border-radius:5px; cursor:pointer; }
  button.off{ color:#5a6b64; border-color:#22302a; }
  button:hover{ background:#1a2a23; }
  .hint{ font-size:11px; color:#5a6b64; margin-bottom:14px; text-align:center; }
</style>
</head>
<body>
<h1>Isometric Particle Viewer</h1>

<div class="patternRowWrapper">
  <button class="arrowBtn" id="arrowLeft">&#9664;</button>
  <div class="patternRowViewport" id="patternRowViewport">
    <div class="patternRow" id="patternRow"></div>
  </div>
  <button class="arrowBtn" id="arrowRight">&#9654;</button>
</div>
<div class="errorBanner" id="errorBanner" style="display:none;"></div>

<div class="hint">w/a/s/d rotate the view &middot; <button id="resetViewBtn" style="font-size:11px; padding:4px 10px;">Reset view</button> <button class="off" id="zoomFitBtn" style="font-size:11px; padding:4px 10px;">Zoom to fit</button></div>
<div class="isoStage">
  <canvas id="iso" width="640" height="640"></canvas>
</div>
<div class="lowerPanel">
  <div class="table-box"><table id="dataTable"></table></div>
  <div class="controls">
    <button id="playBtn">Play</button>
    <button id="stepBtn">Step</button>
    <button id="trailsBtn">Trails</button>
    <button class="off" id="vectorsBtn">Vectors</button>
  </div>
</div>

<script>
function sign(v){ return v>0?1:(v<0?-1:0); }
function step3D(particles){
  const deltas = particles.map((p,i)=>{
    let bestD=Infinity, tied=[];
    for (let j=0;j<particles.length;j++){
      if (j===i) continue;
      const q=particles[j];
      const d2=(q.x-p.x)**2+(q.y-p.y)**2+(q.z-p.z)**2;
      if (d2<bestD){ bestD=d2; tied=[j]; } else if (d2===bestD) tied.push(j);
    }
    let sx=0,sy=0,sz=0;
    tied.forEach(j=>{ const q=particles[j]; sx+=sign(q.x-p.x); sy+=sign(q.y-p.y); sz+=sign(q.z-p.z); });
    return { dvx:sign(sx), dvy:sign(sy), dvz:sign(sz) };
  });
  particles.forEach((p,i)=>{
    p.vx+=deltas[i].dvx; p.vy+=deltas[i].dvy; p.vz+=deltas[i].dvz;
    p.x+=p.vx; p.y+=p.vy; p.z+=p.vz;
  });
}

// same flat manifest system as the orthographic viewer — a plain array of
// filenames, each file in this same folder, button label = filename minus
// ".json". No folders here, so (unlike the 2D picker) there's nothing that
// needs localStorage.
const PATTERNS_DIR = '3d_patterns/';
const MASTER_COLORS = ['#8bf3c9', '#f2a65a', '#7aa7f2', '#e17dbf', '#e0c05a', '#ef6f6f', '#b28cf2', '#a8e05a', '#5ad6e0'];
function colorFor(i){
  if (i < MASTER_COLORS.length) return MASTER_COLORS[i];
  return 'hsl(' + Math.round(((i - MASTER_COLORS.length) * 137.508 + 100) % 360) + ',72%,68%)';
}

let manifestFiles = [];
let currentFilename = null;
let INITIAL, PERIOD, COLORS, history, displayHistory, tieInfo, SCALE;
let DEPTH_MIN = 0, DEPTH_MAX = 1;
let FIXED_SCALE = 1;          // sized once per pattern for its greatest possible extent, at ANY rotation
let zoomToFitEnabled = false;  // off by default: the object holds a constant on-screen size while rotating
let ISO_CENTER = { x:0, y:0 };   // the projected bounding box's own center, in raw (pre-scale) iso units

// ---- camera rotation ----------------------------------------------------
// The floor is always the XY plane, stacked along Z — that never changes.
// What changes is the camera's orientation around that fixed structure,
// tracked as three orthonormal world-space vectors — right, up, and
// forward (the viewing direction) — rather than a rotation matrix. This is
// the standard orbit-camera model: a/d spin the view around the camera's
// OWN current up vector, w/s tilt it around the camera's OWN current
// right vector, both always relative to wherever the view currently is,
// never to a fixed world axis. That's what makes left/right and up/down
// mean "as the user currently sees them" rather than "around world Z" or
// "around whatever used to be on the left" — the previous scheme's
// (correct, but different) convention.
function dot3(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
function cross3(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function norm3(v){ const m=Math.hypot(v[0],v[1],v[2]); return [v[0]/m, v[1]/m, v[2]/m]; }
// Rodrigues' rotation formula: rotate vector v by `deg` around unit axis k
function rotateAround(v, k, deg){
  const r = deg*Math.PI/180, c = Math.cos(r), s = Math.sin(r);
  const kxv = cross3(k, v), kdotv = dot3(k, v);
  return [
    v[0]*c + kxv[0]*s + k[0]*kdotv*(1-c),
    v[1]*c + kxv[1]*s + k[1]*kdotv*(1-c),
    v[2]*c + kxv[2]*s + k[2]*kdotv*(1-c),
  ];
}
// The baseline (identity) view, expressed this way: these three were
// derived so that K*(P.camRight), -K*(P.camUp) reproduce the original
// fixed isometric formula exactly (verified to within 1e-14 before this
// was ever wired up) — so the default view is pixel-identical to before,
// this is just a different, more rotation-friendly way of holding it.
const BASE_RIGHT = norm3([1,-1,0]);
const BASE_UP = norm3([-1,-1,2]);
const BASE_FORWARD = norm3([1,1,1]);
const ISO_K = Math.sqrt(6)/2;
let camRight = BASE_RIGHT, camUp = BASE_UP, camForward = BASE_FORWARD;

const ROT_STEP_DEG = 15;   // shared by a/d and w/s now, for an equally smooth feel on both

function yaw(deg){   // a/d: spin around the camera's OWN current up vector (up itself unchanged)
  camRight = norm3(rotateAround(camRight, camUp, deg));
  camForward = norm3(rotateAround(camForward, camUp, deg));
  recompute(); draw();
}
function tilt(deg){  // w/s: tip around the camera's OWN current right vector (right itself unchanged)
  camUp = norm3(rotateAround(camUp, camRight, deg));
  camForward = norm3(rotateAround(camForward, camRight, deg));
  recompute(); draw();
}
function resetView(){ camRight = BASE_RIGHT; camUp = BASE_UP; camForward = BASE_FORWARD; recompute(); draw(); }

const DIVERGE_THRESHOLD = 10000;
const FALLBACK_CAP = 2000;

function dryRun(initial, statedPeriod){
  const maxTicks = (Number.isInteger(statedPeriod) && statedPeriod > 0) ? statedPeriod * 2 : FALLBACK_CAP;
  let particles = initial.map(p => ({...p}));
  const startStr = JSON.stringify(particles);
  const ranges = { x:{min:Infinity,max:-Infinity}, y:{min:Infinity,max:-Infinity}, z:{min:Infinity,max:-Infinity} };
  function track(pts){ pts.forEach(p=>['x','y','z'].forEach(ax=>{ if(p[ax]<ranges[ax].min) ranges[ax].min=p[ax]; if(p[ax]>ranges[ax].max) ranges[ax].max=p[ax]; })); }
  track(particles);

  let diverged = false, periodConfirmed = false;
  for (let t=1; t<=maxTicks; t++){
    step3D(particles);
    for (const p of particles){
      if (Math.abs(p.x)>DIVERGE_THRESHOLD || Math.abs(p.y)>DIVERGE_THRESHOLD || Math.abs(p.z)>DIVERGE_THRESHOLD){ diverged = true; break; }
    }
    if (diverged) break;
    track(particles);
    if (t === statedPeriod && JSON.stringify(particles) === startStr) periodConfirmed = true;
  }
  return { ranges, diverged, periodConfirmed };
}

function showError(message){
  const banner = document.getElementById('errorBanner');
  banner.textContent = message;
  banner.style.display = 'block';
}
function hideError(){
  document.getElementById('errorBanner').style.display = 'none';
}

// ---- isometric projection ---------------------------------------------
// XY is the floor, Z is "up" on screen — the reverse of a screen's own
// axes, which is why this needs its own projection rather than reusing
// worldToCanvas from the orthographic viewer. A point's screen position is
// just how far it sits along the camera's current right and up vectors,
// scaled by the one constant (ISO_K) that reproduces the original fixed
// isometric look at the baseline orientation.
function isoProject(x, y, z){
  const P = [x, y, z];
  return { ix: ISO_K * dot3(P, camRight), iy: -ISO_K * dot3(P, camUp) };
}
// depth is how far a point sits along the camera's current forward
// (viewing) direction — larger means closer to the camera. Since the
// camera orientation now rotates freely, this has to be measured against
// the CURRENT camForward every time, not assumed fixed.
function depthOf(x, y, z){
  return dot3([x, y, z], camForward);
}

const CANVAS_SIZE = 640;
const CANVAS_CENTER = CANVAS_SIZE / 2;
function worldToScreen(x, y, z){
  const {ix, iy} = isoProject(x, y, z);
  return { cx: CANVAS_CENTER + (ix - ISO_CENTER.x) * SCALE, cy: CANVAS_CENTER + (iy - ISO_CENTER.y) * SCALE };
}

function loadPattern(initial, period, filename){
  const check = dryRun(initial, period);

  if (check.diverged){
    showError('"' + filename + '" was rejected: coordinates exceeded ' + DIVERGE_THRESHOLD + ' within ' + (period*2) + ' ticks — this pattern appears to diverge rather than repeat.');
    return;
  }
  if (!check.periodConfirmed){
    showError('"' + filename + '" was rejected: it does not return to its starting state at the claimed period (' + period + '). The file may be corrupted or hand-edited incorrectly.');
    return;
  }
  hideError();

  currentFilename = filename;
  INITIAL = initial;
  PERIOD = period;
  COLORS = INITIAL.map((_, i) => colorFor(i));

  history = [];
  tieInfo = [];
  let particles = INITIAL.map(pt=>({...pt}));
  for (let t=0; t<=PERIOD; t++){
    history.push(particles.map(pt=>({x:pt.x,y:pt.y,z:pt.z,vx:pt.vx,vy:pt.vy,vz:pt.vz})));
    tieInfo.push(particles.map((pt,i)=>{
      let bestD=Infinity, tied=[];
      for (let j=0;j<particles.length;j++){
        if (j===i) continue;
        const q=particles[j];
        const d2=(q.x-pt.x)**2+(q.y-pt.y)**2+(q.z-pt.z)**2;
        if (d2<bestD){ bestD=d2; tied=[j]; } else if (d2===bestD) tied.push(j);
      }
      let sx=0,sy=0,sz=0;
      tied.forEach(j=>{ const q=particles[j]; sx+=sign(q.x-pt.x); sy+=sign(q.y-pt.y); sz+=sign(q.z-pt.z); });
      return { tied, dvx:sign(sx), dvy:sign(sy), dvz:sign(sz) };
    }));
    if (t<PERIOD) step3D(particles);
  }

  // same pure display-shift as the orthographic viewer: centre the
  // pattern's own bounding box at the origin. history itself (what the
  // table reads) stays untouched, raw, exact integers.
  let gMinX=Infinity, gMinY=Infinity, gMinZ=Infinity, gMaxX=-Infinity, gMaxY=-Infinity, gMaxZ=-Infinity;
  history.forEach(frame => frame.forEach(pt=>{
    if (pt.x<gMinX) gMinX=pt.x; if (pt.x>gMaxX) gMaxX=pt.x;
    if (pt.y<gMinY) gMinY=pt.y; if (pt.y>gMaxY) gMaxY=pt.y;
    if (pt.z<gMinZ) gMinZ=pt.z; if (pt.z>gMaxZ) gMaxZ=pt.z;
  }));
  const gCenterX=(gMinX+gMaxX)/2, gCenterY=(gMinY+gMaxY)/2, gCenterZ=(gMinZ+gMaxZ)/2;
  displayHistory = history.map(frame => frame.map(pt => ({
    x:pt.x-gCenterX, y:pt.y-gCenterY, z:pt.z-gCenterZ, vx:pt.vx, vy:pt.vy, vz:pt.vz
  })));

  // depth range for the size/alpha cue, over the true (1,1,1) depth value
  DEPTH_MIN = Infinity; DEPTH_MAX = -Infinity;
  displayHistory.forEach(frame => frame.forEach(p => {
    const d = depthOf(p.x, p.y, p.z);
    if (d<DEPTH_MIN) DEPTH_MIN = d; if (d>DEPTH_MAX) DEPTH_MAX = d;
  }));

  // the fixed, rotation-independent scale: an orthographic projection can
  // only ever shrink a distance, never grow it, so the on-screen distance
  // of any point from the (centred) origin can never exceed its true 3D
  // distance from the origin, for ANY camera orientation — and a point
  // directly in the current viewing plane achieves that distance exactly.
  // So the bounding-SPHERE radius (max distance from centre, over every
  // tick and particle) is the tight worst-case size needed to guarantee
  // nothing is ever clipped, at any rotation at all. Verified numerically
  // against 200,000 random orientations before relying on it. Centred data
  // means this radius is symmetric, so the matching centre is always the
  // coordinate origin — no per-rotation offset needed, unlike the fitted
  // mode below.
  let maxDistSq = 0;
  displayHistory.forEach(frame => frame.forEach(p => {
    const d2 = p.x*p.x + p.y*p.y + p.z*p.z;
    if (d2 > maxDistSq) maxDistSq = d2;
  }));
  const boundingRadius = Math.sqrt(maxDistSq);
  // the projection scales every dot-product by ISO_K (see isoProject), so
  // the worst-case projected distance is ISO_K*boundingRadius, not the
  // bounding radius alone — missing this factor was caught by testing
  // against the actual farthest point in several real patterns, not just
  // the single-pattern spot-check that happened not to expose it.
  FIXED_SCALE = (CANVAS_CENTER - 20) / (ISO_K * boundingRadius + 0.45);

  recompute();

  document.querySelectorAll('.patternBtn').forEach(b=>{
    b.classList.toggle('selected', b.dataset.filename === filename);
  });

  currentTick = 0;
  playing = false;
  document.getElementById('playBtn').classList.remove('playing');
  draw();
}

// Recomputes everything that depends on the CURRENT camera rotation:
// SCALE, ISO_CENTER, and the floor. Runs once when a pattern loads and
// again after every rotation change (yaw/tilt/reset) — rotating changes
// how the trajectory projects onto the screen, so the fit has to redo.
// The floor itself is always the XY plane stacked along Z — that part
// never depends on rotation — but its lattice step does, since the step
// is sized from SCALE, so it's recomputed here too for consistency.
function recompute(){
  if (zoomToFitEnabled){
    // fit the whole trajectory's PROJECTED shape, not its world-space
    // extent — an isometric projection skews and mixes the three axes
    // together, so the on-screen shape isn't simply proportional to any
    // one axis's world extent the way an orthographic panel's is. Project
    // every point through the CURRENT rotation at unit scale first, find
    // the resulting on-screen bounding box, then solve for the scale (and
    // the offset that centres it). Recomputed on every rotation, so the
    // object's apparent size changes as you turn it — the trade-off for
    // always filling the canvas as tightly as the current angle allows.
    let isoMinX=Infinity, isoMaxX=-Infinity, isoMinY=Infinity, isoMaxY=-Infinity;
    displayHistory.forEach(frame => frame.forEach(pt => {
      const {ix, iy} = isoProject(pt.x, pt.y, pt.z);
      if (ix<isoMinX) isoMinX=ix; if (ix>isoMaxX) isoMaxX=ix;
      if (iy<isoMinY) isoMinY=iy; if (iy>isoMaxY) isoMaxY=iy;
    }));
    const isoW = Math.max(isoMaxX-isoMinX, 0.0001), isoH = Math.max(isoMaxY-isoMinY, 0.0001);
    const USABLE_HALF = CANVAS_CENTER - 20;        // small margin from the canvas edge
    const MAX_DOT_RADIUS_WORLD = 0.45;              // half of the largest dot diameter (0.9)
    SCALE = Math.min(
      USABLE_HALF / (isoW/2 + MAX_DOT_RADIUS_WORLD),
      USABLE_HALF / (isoH/2 + MAX_DOT_RADIUS_WORLD)
    );
    ISO_CENTER = { x:(isoMinX+isoMaxX)/2, y:(isoMinY+isoMaxY)/2 };
  } else {
    // default: a constant scale, sized once for the pattern's greatest
    // possible extent at any rotation, so the object neither grows nor
    // shrinks as it's turned. The matching centre is always the origin —
    // see the bounding-sphere note where FIXED_SCALE is computed.
    SCALE = FIXED_SCALE;
    ISO_CENTER = { x:0, y:0 };
  }
}

// ---- orientation gizmo ---------------------------------------------------
// With free rotation now doing the job the floor planes used to do (making
// orientation legible), the planes themselves became clutter rather than
// signal. In their place: a small translucent cube, fixed in the corner of
// the canvas, that rotates in sync with the main view — the same idea as
// the gizmo in the corner of a CAD viewport. Its own three edges that meet
// at the origin corner are drawn brighter and a little longer than the
// rest, marking +X, +Y and +Z directly on the cube itself.
const GIZMO_SIZE = 1;            // arbitrary world units — this cube has no relation to the pattern's own scale
const GIZMO_EXTEND = 1.35;       // how far the three special edges reach past the cube's own corner
const GIZMO_PIXEL_SCALE = 32;    // fixed pixels per world unit — independent of the main view's SCALE, so the gizmo never changes size
const GIZMO_ANCHOR = { cx: CANVAS_SIZE - 60, cy: 60 };  // fixed screen position, upper right

const GV = {   // the cube's 8 corners, one at the origin, extending into the positive octant
  '000':[0,0,0], '100':[GIZMO_SIZE,0,0], '010':[0,GIZMO_SIZE,0], '001':[0,0,GIZMO_SIZE],
  '110':[GIZMO_SIZE,GIZMO_SIZE,0], '101':[GIZMO_SIZE,0,GIZMO_SIZE], '011':[0,GIZMO_SIZE,GIZMO_SIZE], '111':[GIZMO_SIZE,GIZMO_SIZE,GIZMO_SIZE],
};
const GIZMO_FACES = [
  ['000','100','110','010'], ['001','101','111','011'],
  ['000','100','101','001'], ['010','110','111','011'],
  ['000','010','011','001'], ['100','110','111','101'],
];
// [from, to, isSpecial] — the three specials are the ones meeting at the origin, one per axis
const GIZMO_EDGES = [
  ['000','100',true], ['010','110',false], ['001','101',false], ['011','111',false],
  ['000','010',true], ['100','110',false], ['001','011',false], ['101','111',false],
  ['000','001',true], ['100','101',false], ['010','011',false], ['110','111',false],
];

function gizmoScreen(x, y, z){
  // project through the SAME camera basis as the main view, so the gizmo
  // always shows the current orientation, but with its own fixed scale and
  // a fixed screen anchor instead of SCALE/ISO_CENTER — keeping the gizmo
  // itself at a constant size and position, centred on its own local
  // middle (0.5,0.5,0.5) rather than the pattern's bounding sphere.
  const ix = ISO_K * dot3([x,y,z], camRight), iy = -ISO_K * dot3([x,y,z], camUp);
  const cix = ISO_K * dot3([0.5,0.5,0.5], camRight), ciy = -ISO_K * dot3([0.5,0.5,0.5], camUp);
  return { cx: GIZMO_ANCHOR.cx + (ix-cix)*GIZMO_PIXEL_SCALE, cy: GIZMO_ANCHOR.cy + (iy-ciy)*GIZMO_PIXEL_SCALE };
}

function drawGizmo(ctx){
  // faces: faint translucent fill, farthest to nearest so nearer faces
  // correctly paint over farther ones
  const facesByDepth = GIZMO_FACES.map(f => {
    const pts = f.map(k => GV[k]);
    const center = [0,1,2].map(i => pts.reduce((s,p)=>s+p[i],0)/4);
    return { pts, depth: depthOf(center[0],center[1],center[2]) };
  }).sort((a,b)=>a.depth-b.depth);
  facesByDepth.forEach(({pts})=>{
    ctx.fillStyle = 'rgba(139,243,201,0.20)';
    ctx.beginPath();
    pts.forEach((p,i)=>{ const s=gizmoScreen(p[0],p[1],p[2]); if (i===0) ctx.moveTo(s.cx,s.cy); else ctx.lineTo(s.cx,s.cy); });
    ctx.closePath();
    ctx.fill();
  });

  // the 9 ordinary edges, at 50% alpha
  ctx.strokeStyle = 'rgba(139,243,201,0.5)';
  ctx.lineWidth = 1;
  GIZMO_EDGES.filter(e=>!e[2]).forEach(([a,b])=>{
    const pa=gizmoScreen(...GV[a]), pb=gizmoScreen(...GV[b]);
    ctx.beginPath(); ctx.moveTo(pa.cx,pa.cy); ctx.lineTo(pb.cx,pb.cy); ctx.stroke();
  });

  // the 3 special axis edges: brighter, extended past the cube's corner,
  // labelled — the actual "which way is +x/+y/+z" indicator. No arrowheads,
  // matching the plain velocity-vector lines in the main view.
  ctx.strokeStyle = 'rgba(139,243,201,0.95)';
  ctx.lineWidth = 1.5;
  ctx.font = '11px IBM Plex Mono, monospace';
  ctx.fillStyle = '#8bf3c9';
  const labels = { '100':'x', '010':'y', '001':'z' };
  GIZMO_EDGES.filter(e=>e[2]).forEach(([a,b])=>{
    const tip = GV[b].map(c => c*GIZMO_EXTEND);
    const pa = gizmoScreen(...GV[a]), pb = gizmoScreen(tip[0],tip[1],tip[2]);
    ctx.beginPath(); ctx.moveTo(pa.cx,pa.cy); ctx.lineTo(pb.cx,pb.cy); ctx.stroke();
    ctx.fillText(labels[b], pb.cx+4, pb.cy+4);
  });
}

let currentTick = 0;
let playing = false;
let lastFrame = 0;
let showTrails = true;
let showVectors = false;

function draw(){
  const ctx = document.getElementById('iso').getContext('2d');
  ctx.fillStyle = '#0f1815';
  ctx.fillRect(0,0,CANVAS_SIZE,CANVAS_SIZE);

  if (showTrails){
    for (let pi=0; pi<INITIAL.length; pi++){
      ctx.strokeStyle = COLORS[pi];
      ctx.globalAlpha = 0.65;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (let t=0; t<PERIOD; t++){
        const pt = displayHistory[t][pi];
        const {cx, cy} = worldToScreen(pt.x, pt.y, pt.z);
        if (t===0) ctx.moveTo(cx,cy); else ctx.lineTo(cx,cy);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  if (showVectors){
    for (let pi=0; pi<INITIAL.length; pi++){
      const pt = displayHistory[currentTick][pi];
      const start = worldToScreen(pt.x, pt.y, pt.z);
      const end = worldToScreen(pt.x+pt.vx, pt.y+pt.vy, pt.z+pt.vz);
      ctx.strokeStyle = COLORS[pi];
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = 0.9;
      ctx.beginPath();
      ctx.moveTo(start.cx, start.cy);
      ctx.lineTo(end.cx, end.cy);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // particle dots: size and alpha both encode true depth along the
  // camera's own viewing direction (x+y+z) — a single honest value here,
  // where the orthographic panels each needed their own proxy axis
  const dotInfos = [];
  for (let pi=0; pi<INITIAL.length; pi++){
    const pt = displayHistory[currentTick][pi];
    const {cx, cy} = worldToScreen(pt.x, pt.y, pt.z);
    const d = depthOf(pt.x, pt.y, pt.z);
    let t = DEPTH_MAX > DEPTH_MIN ? (d - DEPTH_MIN) / (DEPTH_MAX - DEPTH_MIN) : 0.5;
    const diameterWorld = 0.5 + t * (0.9 - 0.5);
    const radiusPx = (diameterWorld / 2) * SCALE;
    const alpha = 0.4 + t * (1.0 - 0.4);
    dotInfos.push({ pi, cx, cy, radiusPx, alpha, t, x:pt.x, y:pt.y, z:pt.z });
  }

  // same occlusion rule as the orthographic viewer: a strictly-closer
  // particle whose circle overlaps a farther one hides it outright,
  // unless the two are at the exact same 3D point, in which case they
  // blend instead. With only one camera here there's no equivalent of
  // "same on THIS panel but different depth" to guard against — true 3D
  // coincidence is the only case that matters.
  const hidden = new Array(dotInfos.length).fill(false);
  for (let i=0; i<dotInfos.length; i++){
    for (let j=0; j<dotInfos.length; j++){
      if (i===j) continue;
      const A = dotInfos[i], B = dotInfos[j];
      if (B.t <= A.t) continue;
      if (A.x===B.x && A.y===B.y && A.z===B.z) continue;
      const dx = A.cx-B.cx, dy = A.cy-B.cy;
      const distSq = dx*dx + dy*dy;
      const radiusSum = A.radiusPx + B.radiusPx;
      if (distSq < radiusSum*radiusSum){ hidden[i] = true; break; }
    }
  }

  dotInfos.forEach((d, idx)=>{
    if (hidden[idx]) return;
    ctx.globalAlpha = d.alpha;
    ctx.fillStyle = COLORS[d.pi];
    ctx.beginPath();
    ctx.arc(d.cx, d.cy, d.radiusPx, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  drawGizmo(ctx);
  updateTable();
}

function fmt3(x,y,z){ return '('+x+','+y+','+z+')'; }

function updateTable(){
  const frame = history[currentTick];
  const ties = tieInfo[currentTick];
  const table = document.getElementById('dataTable');
  let html = '<tr><th></th><th>pos</th><th>vel</th><th>accel</th><th>near</th></tr>';
  for (let pi=0; pi<INITIAL.length; pi++){
    const p = frame[pi];
    const t = ties[pi];
    const dot = '<span class="dot" style="background:'+COLORS[pi]+'"></span>';
    const pos = fmt3(p.x, p.y, p.z);
    const vel = fmt3(p.vx, p.vy, p.vz);
    const accel = fmt3(t.dvx, t.dvy, t.dvz);
    const nbrs = '<span class="nbrs">' + t.tied.map(j=>'<span class="dot" style="background:'+COLORS[j]+'"></span>').join('') + '</span>';
    html += '<tr><td>'+dot+'</td><td>'+pos+'</td><td>'+vel+'</td><td>'+accel+'</td><td>'+nbrs+'</td></tr>';
  }

  html += '<tr class="legendRow"><td colspan="5">tick ' + (currentTick+1) + ' / ' + PERIOD + '</td></tr>';
  table.innerHTML = html;
}

function tick(ts){
  if (!playing) return;
  if (ts - lastFrame > 150){
    currentTick = (currentTick + 1) % PERIOD;
    draw();
    lastFrame = ts;
  }
  requestAnimationFrame(tick);
}

document.getElementById('playBtn').addEventListener('click', ()=>{
  playing = !playing;
  document.getElementById('playBtn').classList.toggle('playing', playing);
  if (playing){ lastFrame = 0; requestAnimationFrame(tick); }
});

document.getElementById('stepBtn').addEventListener('click', ()=>{
  playing = false;
  document.getElementById('playBtn').classList.remove('playing');
  currentTick = (currentTick + 1) % PERIOD;
  draw();
});

document.getElementById('trailsBtn').addEventListener('click', ()=>{
  showTrails = !showTrails;
  document.getElementById('trailsBtn').classList.toggle('off', !showTrails);
  draw();
});

document.getElementById('vectorsBtn').addEventListener('click', ()=>{
  showVectors = !showVectors;
  document.getElementById('vectorsBtn').classList.toggle('off', !showVectors);
  draw();
});

function fetchAndLoad(filename){
  fetch(PATTERNS_DIR + filename)
    .then(res => {
      if (!res.ok) throw new Error('could not fetch ' + filename + ' (' + res.status + ')');
      return res.json();
    })
    .then(data => {
      if (!data.nearest || !Number.isInteger(data.period)){
        showError('"' + filename + '" is missing required fields (nearest, period).');
        return;
      }
      loadPattern(data.nearest, data.period, filename);
    })
    .catch(err => showError('Could not load ' + filename + ': ' + err.message));
}

document.getElementById('resetViewBtn').addEventListener('click', resetView);
document.getElementById('zoomFitBtn').addEventListener('click', ()=>{
  zoomToFitEnabled = !zoomToFitEnabled;
  document.getElementById('zoomFitBtn').classList.toggle('off', !zoomToFitEnabled);
  recompute();
  draw();
});
// a/d spin the view left/right around whatever's currently "up" on screen.
// w/s tip the view up/down around whatever's currently "right" on screen.
// Both are user-perspective, orbit-camera controls — relative to the
// CURRENT view, not any fixed world axis — and both now share the same
// step size, for an equally smooth feel in every direction.
window.addEventListener('keydown', (e)=>{
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'a') yaw(-ROT_STEP_DEG);
  else if (k === 'd') yaw(ROT_STEP_DEG);
  else if (k === 'w') tilt(ROT_STEP_DEG);
  else if (k === 's') tilt(-ROT_STEP_DEG);
});

const SCROLL_STEP_PX = 220;
document.getElementById('arrowLeft').addEventListener('click', ()=>{
  document.getElementById('patternRowViewport').scrollLeft -= SCROLL_STEP_PX;
});
document.getElementById('arrowRight').addEventListener('click', ()=>{
  document.getElementById('patternRowViewport').scrollLeft += SCROLL_STEP_PX;
});

fetch(PATTERNS_DIR + 'manifest.json')
  .then(res => {
    if (!res.ok) throw new Error('manifest not found (' + res.status + ')');
    return res.json();
  })
  .then(files => {
    if (!Array.isArray(files) || files.length === 0){
      showError('3d_patterns/manifest.json is empty.');
      return;
    }
    manifestFiles = files;
    const row = document.getElementById('patternRow');
    files.forEach(filename=>{
      const btn = document.createElement('button');
      btn.className = 'patternBtn';
      btn.dataset.filename = filename;
      btn.textContent = filename.replace(/\.json$/i, '');
      btn.addEventListener('click', ()=> fetchAndLoad(filename));
      row.appendChild(btn);
    });
    fetchAndLoad(files[0]);
  })
  .catch(err => {
    showError('No 3d_patterns/manifest.json found (or it failed to load). Expected a JSON array of filenames, e.g. ["n3p50.json", "n5p18.json"], with each file in that same 3d_patterns/ folder.');
  });
</script>
